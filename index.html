<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>estudaemilly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simulados de Odontologia em 3 matérias: Clínica Ampliada (Estágio), Odontopediatria e Pacientes com Necessidades Especiais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: coluna única de leitura (max 760px); barra fixa no topo durante a prova; grade de cartões na tela inicial. */
:root{
  --bg:#f3f6f7;        /* esmalte frio */
  --surface:#ffffff;
  --surface-2:#e8eef0;
  --ink:#16243a;       /* tinta de prontuário */
  --muted:#5b6b7d;
  --line:#d3dde2;
  --accent:#b8305f;    /* gengiva */
  --accent-soft:#f6dde6;
  --good:#1f7a55; --good-soft:#dcf1e7;
  --bad:#b33a2e;  --bad-soft:#f8e0dc;
  --warn:#8a5a00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e151d; --surface:#16202b; --surface-2:#1e2a37; --ink:#e7edf3; --muted:#9aabbd; --line:#2a3949;
  --accent:#ff7ba4; --accent-soft:#3a1d2a; --good:#5fd3a0; --good-soft:#123326; --bad:#ff8a7c; --bad-soft:#3a1c18; --warn:#f0c060;
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0e151d; --surface:#16202b; --surface-2:#1e2a37; --ink:#e7edf3; --muted:#9aabbd; --line:#2a3949;
  --accent:#ff7ba4; --accent-soft:#3a1d2a; --good:#5fd3a0; --good-soft:#123326; --bad:#ff8a7c; --bad-soft:#3a1c18; --warn:#f0c060;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700;font-size:15px;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}

/* topo */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.logo b{color:var(--accent)}
.tooth{width:22px;height:22px;flex:none}

/* início */
.hero{padding-block:28px 8px;display:grid;gap:12px}
.hero h1{font-size:clamp(34px,7vw,52px);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;max-width:58ch}
.subjects{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

.mode{margin-top:22px;display:grid;gap:8px}
.label{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface-2);border-radius:var(--r);padding:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left;display:grid;gap:2px}
.seg button strong{font-size:15.5px}
.seg button span{font-size:13px;color:var(--muted);line-height:1.35}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"] strong{color:var(--accent)}
.opts{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:15px}
.opts input{width:18px;height:18px;accent-color:var(--accent)}

.grid{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:grid;gap:10px;align-content:start;min-width:0}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:22px;font-weight:700}
.card .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.card .meta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.card .meta b{color:var(--ink)}
.card.mix{background:var(--surface-2);border-style:dashed}
.foot{margin-top:28px;font-size:13.5px;color:var(--muted);display:grid;gap:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13.5px;justify-self:start}

/* prova */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
.examhead{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.examhead .in{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.examhead .ttl{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.examhead .prog{flex:1;min-width:0;display:grid;gap:4px}
.examhead .prog small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px}
.qnum{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(19px,3.2vw,22px);line-height:1.45;margin:10px 0 18px;font-weight:700}
.alts{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.alt{width:100%;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;line-height:1.45;font-size:16.5px}
.alt:hover:not(:disabled){border-color:var(--ink)}
.alt .k{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:14px;font-family:var(--f-display)}
.alt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.alt[aria-pressed="true"] .k{background:var(--accent);color:var(--surface)}
.alt.ok{border-color:var(--good);background:var(--good-soft)}
.alt.ok .k{background:var(--good);color:var(--surface)}
.alt.no{border-color:var(--bad);background:var(--bad-soft)}
.alt.no .k{background:var(--bad);color:var(--surface)}
.alt:disabled{cursor:default}
.explain{margin-top:14px;border-radius:var(--r);padding:14px 16px;background:var(--surface-2);font-size:15.5px}
.explain strong{display:block;margin-bottom:4px;font-family:var(--f-display);font-size:16px}
.explain.good strong{color:var(--good)} .explain.bad strong{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.dots{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.dot{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.dot.done{background:var(--surface-2);border-color:var(--surface-2)}
.dot.cur{border-color:var(--accent);color:var(--accent)}
.dot.ok{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}
.dot.no{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.confirm{margin-top:18px;border:1.5px solid var(--warn);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;background:var(--surface)}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap}

/* resultado */
.score{margin-top:26px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display)}
.ring .v b{font-size:34px;font-weight:800;line-height:1}
.ring .v span{font-size:12.5px;color:var(--muted);font-family:var(--f-body)}
.score h2{font-size:clamp(26px,5vw,34px);font-weight:800}
.score p{margin:6px 0 0}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.section{margin-top:30px;display:grid;gap:12px}
.section h3{font-size:20px}
.topics{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;font-size:15px}
.trow .bar{grid-column:1/-1;height:8px}
.trow .bar i.lo{background:var(--bad)} .trow .bar i.mid{background:var(--warn)} .trow .bar i.hi{background:var(--good)}
.trow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.filter{display:flex;gap:8px;flex-wrap:wrap}
.filter .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;gap:8px}
.rev.no{border-left:5px solid var(--bad)} .rev.ok{border-left:5px solid var(--good)} .rev.skip{border-left:5px solid var(--warn)}
.rev .q{font-weight:700}
.rev .a{font-size:15px;display:grid;gap:3px}
.rev .a .y{color:var(--bad)} .rev .a .c{color:var(--good)}
.rev .e{font-size:14.5px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
@media (max-width:520px){
  .score{grid-template-columns:1fr;justify-items:start}
  .seg{grid-template-columns:1fr}
  .examhead .ttl{display:none}
  body{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .25s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
  .ring circle.fg{transition:stroke-dashoffset .9s ease-out}
}

/* matérias: cada uma tem sua cor de destaque */
#app[data-m="est"]{--accent:#b8305f;--accent-soft:#f6dde6}
#app[data-m="odp"]{--accent:#0f7b77;--accent-soft:#d8efed}
#app[data-m="pne"]{--accent:#3f55b8;--accent-soft:#e0e5f7}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #app[data-m="est"]{--accent:#ff7ba4;--accent-soft:#3a1d2a}
 :root:not([data-theme="light"]) #app[data-m="odp"]{--accent:#4fd1c5;--accent-soft:#12302e}
 :root:not([data-theme="light"]) #app[data-m="pne"]{--accent:#93a4ff;--accent-soft:#1f2547}}
:root[data-theme="dark"] #app[data-m="est"]{--accent:#ff7ba4;--accent-soft:#3a1d2a}
:root[data-theme="dark"] #app[data-m="odp"]{--accent:#4fd1c5;--accent-soft:#12302e}
:root[data-theme="dark"] #app[data-m="pne"]{--accent:#93a4ff;--accent-soft:#1f2547}
.mats{margin-top:26px;display:grid;gap:12px}
.mat{position:relative;overflow:hidden;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 18px 16px 24px;text-align:left;cursor:pointer;display:grid;gap:10px;min-width:0}
.mat::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--mc)}
.mat:hover{border-color:var(--mc)}
.mat .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mat h2{font-size:clamp(21px,4.4vw,26px);font-weight:800;letter-spacing:-.02em}
.mat .tag{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mc)}
.mat p{margin:0;color:var(--muted);font-size:15px}
.mat .bar i{background:var(--mc)}
.mat .meta{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.mat .meta b{color:var(--ink)}
.mat.geral{background:var(--surface-2);border-style:dashed;--mc:var(--muted)}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.back{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--muted);font-weight:700;font-size:14.5px}
.back:hover{color:var(--ink)}
.mat[data-c="est"]{--mc:#b8305f} .mat[data-c="odp"]{--mc:#0f7b77} .mat[data-c="pne"]{--mc:#3f55b8}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .mat[data-c="est"]{--mc:#ff7ba4} :root:not([data-theme="light"]) .mat[data-c="odp"]{--mc:#4fd1c5} :root:not([data-theme="light"]) .mat[data-c="pne"]{--mc:#93a4ff}}
:root[data-theme="dark"] .mat[data-c="est"]{--mc:#ff7ba4} :root[data-theme="dark"] .mat[data-c="odp"]{--mc:#4fd1c5} :root[data-theme="dark"] .mat[data-c="pne"]{--mc:#93a4ff}
</style>

<body>
<div id="app"></div>
<script>
// Banco de questões — Estágio / Clínica Ampliada (5 provas x 25)
// Formato: [tema, enunciado, [CORRETA, errada, errada, errada], explicação]
const PROVAS_EST = [
{ nome: "Prova 1", questoes: [
["Endodontia","Caso: mulher, 37 anos, dor no dente 36 há 3 dias, espontânea, contínua, pulsátil e irradiada, que piora com líquidos quentes e alivia com água fria. Frio: resposta intensa e persistente. Calor: exacerba a dor. Percussão vertical positiva. RX: restauração extensa próxima à câmara, sem lesão periapical, com discreto aumento do espaço do ligamento. Qual o diagnóstico mais provável?",["Pulpite irreversível sintomática com periodontite apical sintomática","Pulpite reversível com tecidos apicais dentro da normalidade","Necrose pulpar com abscesso apical agudo em evolução","Pulpite irreversível assintomática com periodontite apical crônica"],"Dor espontânea, contínua, irradiada e prolongada ao frio, que piora com o calor, indica pulpite irreversível sintomática. A percussão vertical positiva com leve aumento do espaço periodontal mostra que a inflamação já repercute no periápice (periodontite apical sintomática). Há vitalidade, então não é necrose."],
["Endodontia","No mesmo caso do dente 36 com pulpite irreversível sintomática, qual é a conduta de urgência mais adequada?",["Pulpectomia, irrigação, medicação intracanal e selamento provisório","Apenas prescrever antibiótico e analgésico e reagendar","Proteção pulpar indireta com hidróxido de cálcio e restaurar","Exodontia imediata do 36 por se tratar de dente inflamado"],"A causa da dor é a polpa inflamada. A urgência é remover o tecido pulpar (pulpectomia), irrigar, colocar medicação intracanal (ex.: hidróxido de cálcio) e selar bem. Antibiótico não trata pulpite: não há infecção sistêmica."],
["Anestesiologia","Após bloqueio do alveolar inferior, a paciente tem lábio e tecidos moles anestesiados, mas sente dor intensa ao acessar a polpa do 36 (pulpite irreversível). Qual estratégia é adequada?",["Complementar com articaína 4% infiltrativa e, se preciso, intraligamentar ou intrapulpar","Concluir que a técnica falhou e repetir o mesmo bloqueio até o paciente parar de sentir","Seguir o acesso, porque a anestesia do lábio e da língua garante a anestesia da polpa","Suspender o atendimento, prescrever só analgésico e reagendar a abertura"],"Na pulpite irreversível, a anestesia dos tecidos moles não garante anestesia pulpar. Usa-se anestesia complementar: infiltrativa vestibular com articaína 4% em molares inferiores, intraligamentar e, por último, intrapulpar. Não se segue o procedimento com dor."],
["Endodontia","Um incisivo central inferior tem Comprimento Aparente do Dente (CAD) de 21 mm. Com a lima no CRI, o RX mostra a ponta 1 mm aquém do ápice radiográfico. Quais são o CRD e o CRT?",["CRD 19 mm e CRT 18 mm","CRD 20 mm e CRT 18 mm","CRD 18 mm e CRT 19 mm","CRD 21 mm e CRT 20 mm"],"CRI = CAD − 3 mm = 18 mm. Se a lima ficou 1 mm aquém do ápice, o CRD = 18 + 1 = 19 mm. O CRT fica 1 mm aquém do CRD: 19 − 1 = 18 mm."],
["Endodontia","Sobre o EDTA como substância auxiliar no tratamento endodôntico, assinale a correta:",["É quelante: age na fração inorgânica, remove a smear layer e abre os túbulos","Tem forte ação antimicrobiana e substitui o hipoclorito como irrigante principal","Dissolve a matéria orgânica e o tecido pulpar necrótico dentro dos canais","É usado como medicação intracanal entre as sessões, no lugar do hidróxido de cálcio"],"O EDTA quelata o cálcio (fração inorgânica), removendo a smear layer e abrindo os túbulos dentinários. Quem dissolve matéria orgânica e tem ação antimicrobiana é o hipoclorito; por isso os dois são usados juntos."],
["Endodontia","Dente 46 com teste ao frio negativo, dor à percussão vertical, dor à mastigação e RX com espessamento do ligamento periodontal apical, sem edema. Diagnóstico provável:",["Necrose pulpar com periodontite apical sintomática","Pulpite reversível com periodontite apical assintomática","Polpa normal com trauma oclusal primário","Necrose pulpar com abscesso apical crônico fistulado"],"Frio negativo indica ausência de vitalidade (necrose). Dor à percussão e à mastigação com espessamento do ligamento caracterizam periodontite apical sintomática. Sem fístula ou edema, não é abscesso."],
["Periodontia","Sobre o espaço biológico, assinale a correta:",["É formado pelo epitélio juncional e pela inserção conjuntiva, acima da crista óssea","É formado apenas pelo sulco gengival e pela margem livre, sem relação com o osso","Pode ser invadido por restaurações subgengivais sem consequência para o periodonto","Localiza-se abaixo da crista óssea, entre o osso alveolar e o ápice radicular"],"O espaço biológico corresponde ao epitélio juncional + inserção do tecido conjuntivo, situados acima da crista óssea (em média 2 a 3 mm, contando o sulco). Sua invasão por restaurações subgengivais causa inflamação crônica e perda óssea localizada."],
["Periodontia","Paciente jovem tem profundidade de sondagem aumentada em várias áreas, sem perda de inserção e sem perda óssea, com gengiva edemaciada e aumentada. Isso caracteriza:",["Bolsa gengival (falsa bolsa)","Bolsa periodontal verdadeira","Periodontite estágio II","Recessão gengival tipo 1"],"Na bolsa gengival (falsa), a profundidade aumenta por edema ou hiperplasia da gengiva, sem migração apical do epitélio juncional e sem perda de inserção. Na bolsa verdadeira há perda de inserção e destruição do suporte."],
["Periodontia","Na classificação de 2017 da periodontite, o que o GRAU representa?",["O risco ou a velocidade de progressão da doença","A gravidade da perda de inserção no pior sítio","O número de dentes perdidos por periodontite","A extensão: localizada ou generalizada"],"O estágio mede a gravidade (quanto perdeu de inserção) e a complexidade. O grau (A, B, C) expressa a taxa de progressão e o risco futuro, considerando fatores como tabagismo e diabetes."],
["Periodontia","Um sítio tem profundidade de sondagem de 5 mm e recessão gengival de 2 mm (margem 2 mm apical à JCE). Qual o nível clínico de inserção (NIC)?",["7 mm","3 mm","5 mm","2 mm"],"Quando a margem está apical à JCE, NIC = profundidade de sondagem + recessão = 5 + 2 = 7 mm. Se a margem estivesse coronal à JCE, subtrairia."],
["Prótese","Paciente com ausência de 36, 37, 46 e 47 (sem dentes posteriores aos espaços) e terceiros molares ausentes não repostos. Qual a classe de Kennedy?",["Classe I","Classe II","Classe III","Classe IV"],"Áreas desdentadas posteriores bilaterais, sem dente distal ao espaço (extremidade livre dos dois lados), formam a Classe I de Kennedy."],
["Prótese","Pelas regras de Applegate, o espaço de um terceiro molar ausente:",["Não entra na classificação se o dente não for reposto","Sempre define a classe, mesmo que o dente não seja reposto","Conta como uma modificação, mesmo sem ser reposto","Transforma qualquer caso em Classe III de Kennedy"],"Applegate: o espaço do terceiro molar ausente não entra na classificação se ele não for reposto. Se o terceiro molar estiver presente e servir de retentor, ele é considerado."],
["Prótese","Na prótese parcial removível, qual a principal função do apoio (oclusal, cíngulo ou incisal)?",["Transmitir as forças ao longo eixo do pilar e impedir a intrusão","Reter a prótese contra o deslocamento no sentido oclusal","Unir os componentes dos dois lados do arco e dar rigidez","Substituir a estética e a função dos dentes ausentes"],"O apoio dá suporte: impede o deslocamento da prótese em direção aos tecidos e direciona as forças ao longo eixo do dente pilar. A retenção é função dos grampos; a união, do conector maior."],
["Prótese","O espaço funcional livre (EFL) é:",["A diferença entre a dimensão vertical de repouso e a de oclusão (2 a 4 mm)","A soma da dimensão vertical de repouso com a dimensão vertical de oclusão","A distância entre a crista do rebordo alveolar e o fundo de sulco vestibular","O espaço entre os incisivos superiores e inferiores em protrusão máxima"],"EFL = DVR − DVO, normalmente entre 2 e 4 mm. Se a DVO for aumentada e invadir o EFL, o paciente pode ter dor, fadiga muscular e ‘batida’ dos dentes ao falar."],
["Cirurgia","Paciente retorna 3 dias após a exodontia do 38 com dor intensa irradiada para o ouvido, alvéolo vazio, sem coágulo, com odor fétido. Qual o diagnóstico e a conduta?",["Alveolite seca: irrigar com soro, curativo no alvéolo e analgésico","Infecção do espaço submandibular: drenagem extraoral imediata e internação","Hemorragia tardia: nova sutura, compressão com gaze e ácido tranexâmico","Dor esperada do pós-operatório: apenas tranquilizar e dispensar o paciente"],"Alvéolo vazio, odor fétido e dor intensa entre o 2º e o 4º dia indicam alveolite seca. A conduta é irrigação suave com soro, curativo no alvéolo (ex.: pasta tipo Alveolex) e analgesia. Antibiótico só se houver sinais de infecção."],
["Cirurgia","Na classificação de Pell & Gregory, um terceiro molar inferior cuja face oclusal está no mesmo nível do plano oclusal do segundo molar está na posição:",["A","B","C","Classe III"],"Pell & Gregory: A, B e C referem-se à profundidade em relação ao segundo molar. A = mesmo nível do plano oclusal; B = entre o plano oclusal e a cervical; C = abaixo da cervical. Classes I, II e III referem-se à relação com o ramo."],
["Cirurgia","Após exodontia do 26, surge uma comunicação buco-sinusal de cerca de 2 mm. Qual a conduta mais adequada?",["Manter o coágulo, suturar e orientar a não assoar o nariz nem usar canudo","Fazer retalho palatino rotacionado imediato, como em todas as comunicações","Irrigar o seio maxilar com soro sob pressão pelo alvéolo para limpar o coágulo","Deixar o alvéolo aberto, sem sutura, para o seio drenar pela boca"],"Comunicações pequenas (até cerca de 2 mm) costumam fechar com a manutenção do coágulo, sutura e cuidados: não assoar o nariz, espirrar de boca aberta, não usar canudo nem fumar. Retalhos ficam para comunicações maiores."],
["Cirurgia","Paciente em uso de varfarina precisa de exodontia simples. INR de hoje: 2,5. Qual a conduta?",["Fazer a exodontia com hemostasia local, sem suspender a varfarina","Pedir ao paciente que suspenda a varfarina por conta própria 7 dias antes","Contraindicar qualquer exodontia enquanto ele estiver usando varfarina","Prescrever ácido acetilsalicílico no pós-operatório para evitar trombose"],"Com INR até cerca de 3,5, exodontias simples podem ser feitas com hemostasia local (sutura, esponja hemostática, compressão, ácido tranexâmico). O dentista não suspende anticoagulante sem o médico."],
["Restauradora","Segundo Black, uma cavidade na face proximal de pré-molar ou molar é Classe:",["II","I","III","V"],"Classe I: fóssulas e fissuras. Classe II: proximais de pré-molares e molares. Classe III: proximais de anteriores sem ângulo incisal. Classe IV: com ângulo incisal. Classe V: terço cervical."],
["Restauradora","No exame intraoral, há mancha branca opaca e rugosa na cervical vestibular do 12, com cavitação restrita ao esmalte. Qual a conduta mais adequada?",["Restauração em resina composta","Restauração em amálgama","Coroa total metalocerâmica","Apenas observar, sem nenhuma conduta"],"Superfície opaca e rugosa indica lesão ativa. Com cavitação, a lesão não se resolve só com remineralização e precisa ser restaurada. Em dente anterior, a resina composta é conservadora e estética. Amálgama e coroa total são inadequados aqui."],
["Restauradora","No exame clínico há manchas opacas, esbranquiçadas e difusas, simétricas em dentes homólogos, sem perda de estrutura e com esmalte íntegro. A paciente cresceu na zona rural usando água de poço com flúor alto. Hipótese:",["Fluorose dentária","Hipomineralização molar-incisivo (HMI)","Hipoplasia de esmalte","Lesão cariosa ativa"],"Opacidades difusas e simétricas em homólogos, ligadas à ingestão excessiva de flúor na formação dos dentes, indicam fluorose. A HMI é demarcada e assimétrica, atinge molares e incisivos e pode fraturar. A hipoplasia tem perda de estrutura."],
["Anestesiologia","Qual destas soluções anestésicas deve ser evitada na gestante?",["Prilocaína 3% com felipressina","Lidocaína 2% com epinefrina 1:100.000","Mepivacaína 2% com epinefrina 1:100.000","Lidocaína 2% com epinefrina 1:200.000"],"A felipressina é derivada da vasopressina e pode ter efeito ocitócico (contração uterina). A prilocaína pode causar metemoglobinemia, também no feto. Para gestantes, a primeira escolha é a lidocaína 2% com epinefrina."],
["Anestesiologia","Adulto de 70 kg. Lidocaína 2% (36 mg por tubete de 1,8 mL), dose máxima de 4,4 mg/kg (limite absoluto de 300 mg). Quantos tubetes no máximo?",["Cerca de 8 tubetes","Cerca de 4 tubetes","Cerca de 12 tubetes","Cerca de 15 tubetes"],"4,4 × 70 = 308 mg, mas o limite absoluto é 300 mg. 300 ÷ 36 = 8,3, ou seja, cerca de 8 tubetes."],
["Clínica Integrada","Paciente com hipertensão arterial controlada com medicação, sem outras limitações. Pela classificação ASA, ele é:",["ASA II","ASA I","ASA III","ASA IV"],"ASA I: saudável. ASA II: doença sistêmica leve e controlada (ex.: hipertensão controlada). ASA III: doença sistêmica grave que limita atividades. ASA IV: doença grave e ameaça constante à vida."],
["Clínica Integrada","Qual a sequência correta das fases do plano de tratamento na clínica integrada?",["Urgência → Adequação → Reavaliação → Definitiva → Manutenção","Definitiva → Urgência → Adequação → Manutenção → Reavaliação","Adequação → Definitiva → Urgência → Reavaliação → Manutenção","Urgência → Definitiva → Adequação → Manutenção → Reavaliação"],"Primeiro resolve-se a dor ou infecção (urgência). Depois controla-se a doença (adequação: raspagem, selamento de lesões, flúor, higiene) e reavalia-se. Só então vêm os procedimentos definitivos e a manutenção periódica."]
]},
{ nome: "Prova 2", questoes: [
["Endodontia","Sobre os testes pulpares, analise: I – Resposta ao frio rápida, que cessa logo após remover o estímulo, sugere polpa normal ou pulpite reversível. II – Resposta ao frio intensa e prolongada sugere pulpite irreversível. III – Ausência de resposta ao frio confirma sempre necrose, sem exceção. IV – Deve-se testar também um dente controle (vizinho ou homólogo). Está correto:",["I, II e IV","I e III","II, III e IV","Todas"],"III é falsa: falsos negativos acontecem em dentes muito calcificados, recém-traumatizados ou com rizogênese incompleta. Por isso o teste é sempre comparado com um dente controle e interpretado junto com a clínica e o RX."],
["Endodontia","Paciente com dor intensa e localizada, edema na região do 46, dente com frio negativo e muita dor à percussão, sem fístula. RX: espessamento do ligamento apical. Diagnóstico:",["Abscesso apical agudo","Abscesso apical crônico","Pulpite reversível","Periodontite apical assintomática"],"Necrose com dor intensa, edema e dor à percussão é abscesso apical agudo. O crônico costuma ser pouco sintomático e drenar por fístula. A conduta envolve acesso, desbridamento e drenagem, com antibiótico só se houver sinais sistêmicos."],
["Endodontia","Dente 21 com fístula na vestibular, assintomático, frio negativo e lesão radiolúcida periapical. Diagnóstico:",["Necrose pulpar com abscesso apical crônico","Pulpite irreversível sintomática","Polpa normal com cisto periapical","Necrose pulpar com abscesso apical agudo"],"A fístula indica drenagem crônica de um processo infeccioso de origem pulpar (necrose). Por ter via de drenagem, o quadro é pouco ou nada doloroso: abscesso apical crônico."],
["Endodontia","Qual é a principal função do hipoclorito de sódio na irrigação endodôntica?",["Dissolver tecido orgânico e ter ação antimicrobiana","Remover a fração inorgânica da smear layer como quelante","Selar definitivamente o sistema de canais após o preparo","Estimular a formação de dentina reparadora no ápice"],"O hipoclorito dissolve matéria orgânica e tem ação antimicrobiana. Não remove a parte inorgânica da smear layer; para isso se usa o EDTA."],
["Endodontia","Qual medicação intracanal é mais usada entre sessões, por ser antimicrobiana e alcalina?",["Pasta de hidróxido de cálcio","Formocresol puro","Eugenol puro","Hipoclorito de sódio 5,25%"],"O hidróxido de cálcio tem pH alto (~12,5), ação antimicrobiana e estimula reparo. É a medicação intracanal de eleição entre sessões."],
["Endodontia","No atendimento de urgência endodôntica, analise: I – A urgência não precisa concluir o tratamento endodôntico. II – Se não terminar, faz-se desinfecção, MIC e selamento coronário. III – Deixar o dente aberto é sempre recomendado para drenagem. Está correto:",["I e II","I, II e III","Apenas III","II e III"],"Manter o dente aberto entre sessões não é recomendado: contamina o sistema de canais com bactérias da saliva e pode piorar o quadro. A drenagem é feita na hora, e depois o dente é medicado e selado."],
["Periodontia","Na classificação de 2017, a periodontite Estágio III tem como característica determinante:",["Perda de inserção interproximal ≥ 5 mm ou perda óssea até o terço médio ou apical","Perda de inserção interproximal de 1 a 2 mm, com perda óssea só no terço coronal","Perda de inserção interproximal de 3 a 4 mm, sem nenhum dente perdido por periodontite","Apenas sangramento à sondagem e cálculo, sem nenhuma perda de inserção clínica"],"Estágio I: 1–2 mm. Estágio II: 3–4 mm. Estágio III: ≥ 5 mm, perda óssea até o terço médio ou apical e até 4 dentes perdidos por periodontite. O Estágio IV acrescenta perda de 5 ou mais dentes e necessidade de reabilitação complexa."],
["Periodontia","Paciente de 40 anos tem perda óssea de 44% no pior dente. Índice = %PO ÷ idade = 1,1. Pela classificação de 2017, o grau é:",["Grau C (progressão rápida)","Grau A (progressão lenta)","Grau B (progressão moderada)","Não é possível graduar"],"Índice perda óssea/idade: < 0,25 = Grau A; 0,25 a 1,0 = Grau B; > 1,0 = Grau C. Com 1,1, a progressão é rápida: Grau C."],
["Periodontia","Paciente diabético com HbA1c de 6,5% e periodontite. Como o diabetes interfere no grau?",["Com HbA1c < 7%, o grau tende a B","Com HbA1c < 7%, o grau sobe sempre para C","O diabetes não interfere na graduação","Diabetes rebaixa o grau para A"],"Na classificação de 2017, HbA1c < 7% é fator compatível com Grau B. HbA1c ≥ 7% eleva para Grau C. Tabagismo segue a mesma lógica: < 10 cigarros/dia = B; ≥ 10 = C."],
["Periodontia","Qual a primeira etapa do tratamento da periodontite?",["Orientação de higiene, controle do biofilme e raspagem supra e subgengival","Cirurgia periodontal de acesso em todos os sítios com bolsa logo na 1ª consulta","Extração de todos os dentes com bolsa ≥ 4 mm para eliminar o foco infeccioso","Antibiótico sistêmico como rotina para todos os pacientes antes de raspar"],"O tratamento começa pela terapia básica: orientação de higiene, controle de fatores retentivos de biofilme e raspagem/alisamento. Depois reavalia-se para decidir sobre cirurgia. Antibiótico não é rotina."],
["Prótese","Paciente tem ausência apenas do 15 e do 16, com 17 presente. Classe de Kennedy:",["Classe III","Classe I","Classe II","Classe IV"],"O espaço é intercalado (há dente posterior ao espaço, o 17). Espaço unilateral com dentes nas duas extremidades é Classe III."],
["Prótese","Paciente sem 11, 12, 21 e 22, com todos os posteriores presentes. Classe de Kennedy:",["Classe IV","Classe III","Classe I","Classe II"],"Espaço único anterior, cruzando a linha média, com dentes posteriores presentes dos dois lados: Classe IV. A Classe IV não tem modificações."],
["Prótese","Na PPR, qual componente une as partes da prótese de um lado do arco ao outro?",["Conector maior","Apoio oclusal","Braço de retenção do grampo","Sela (base)"],"O conector maior (barra lingual, placa palatina etc.) une os componentes dos dois lados e dá rigidez. Conectores menores ligam apoios e grampos ao conector maior."],
["Prótese","Qual destas é uma contraindicação de PPR?",["Doença bucal não tratada, como periodontite descontrolada ou cárie ativa","Ausência de vários dentes posteriores, com extremidade livre bilateral","Paciente que prefere não fazer implantes por motivos financeiros","Espaços protéticos extensos, com mais de três dentes ausentes"],"Antes de qualquer prótese, as doenças bucais devem estar controladas. Periodontite descontrolada, cáries sem tratamento ou lesões suspeitas contraindicam a PPR até a adequação do meio."],
["Cirurgia","Na exodontia, qual o princípio de uso das alavancas?",["Apoio em osso, nunca no dente vizinho, com movimentos controlados","Apoio no dente vizinho para ganhar força e luxar o dente mais rápido","Uso como cunha forçada para fraturar a raiz e retirá-la em pedaços","Uso só depois do fórceps, sem necessidade de sindesmotomia prévia"],"Alavancas trabalham como cunha, roda e eixo ou alavanca, com apoio em osso. Apoiar no dente vizinho pode luxá-lo ou fraturá-lo. Os movimentos são curtos e controlados, protegendo com a outra mão."],
["Cirurgia","Na classificação de Winter, o terceiro molar inferior cujo longo eixo está inclinado em direção ao segundo molar é:",["Mesioangular","Distoangular","Vertical","Horizontal"],"Winter classifica pela inclinação do longo eixo do terceiro molar em relação ao segundo: mesioangular (inclinado para mesial), distoangular, vertical, horizontal, vestíbulo/linguoversão e invertido."],
["Cirurgia","Após uma exodontia, há sangramento persistente. Qual a primeira medida?",["Compressão com gaze por 10 a 15 minutos e revisão do alvéolo","Prescrever ácido acetilsalicílico para aliviar a dor do paciente","Orientar bochechos vigorosos com água quente para limpar o local","Liberar o paciente sem avaliar, pois o sangramento para sozinho"],"A primeira medida é localizar a fonte e fazer compressão. Se não for suficiente: sutura, esponja de colágeno/gelatina, ácido tranexâmico local. AAS piora o sangramento, e bochechos vigorosos deslocam o coágulo."],
["Cirurgia","Qual orientação pós-operatória está correta após exodontia?",["Gelo nas primeiras 24–48 h e dieta fria e pastosa","Bochechar com força várias vezes no primeiro dia","Usar canudo para beber líquidos","Fazer exercício físico intenso no mesmo dia"],"Gelo nas primeiras 24–48 h reduz o edema. A dieta deve ser fria e pastosa. Evitam-se bochechos vigorosos, canudo, cigarro e esforço físico, que podem deslocar o coágulo e causar sangramento ou alveolite."],
["Restauradora","Na proteção do complexo dentino-pulpar, qual a conduta para cavidade profunda sem exposição pulpar, em resina composta?",["CIV (ou hidróxido de cálcio + CIV) como base, depois adesivo e resina","Adesivo aplicado diretamente sobre a polpa, sem nenhum forramento","Apenas resina composta, sem nenhum tratamento da dentina profunda","Formocresol na dentina do fundo da cavidade antes do adesivo e da resina"],"Pelas notas de aula: cavidade rasa ou média → sistema adesivo; cavidade profunda → CIV ou hidróxido de cálcio + CIV antes da restauração; exposição pulpar → hidróxido de cálcio (P.A.) ou MTA."],
["Restauradora","Qual material de proteção pulpar direta induz mineralização e tem boa resistência mecânica?",["MTA (agregado trióxido mineral)","Adesivo dentinário","Verniz cavitário","Cimento de óxido de zinco e eugenol"],"O MTA induz a formação de ponte de dentina, é biocompatível, tem boa resistência e é indicado em exposição pulpar direta. O adesivo é contraindicado em contato com a polpa."],
["Restauradora","Na remoção seletiva de tecido cariado em lesão profunda, o que se faz?",["Remove-se a dentina infectada das paredes e mantém-se a dentina afetada no fundo","Remove-se toda a dentina cariada, inclusive a do fundo, mesmo que exponha a polpa","Mantém-se a dentina infectada nas paredes laterais e remove-se a do fundo","Não se remove nenhum tecido cariado: só se sela a cavidade com resina"],"A dentina infectada (amolecida, contaminada) é removida, principalmente nas paredes circundantes, para garantir um bom selamento. A dentina afetada (passível de remineralização) é mantida no fundo para evitar exposição pulpar."],
["Anestesiologia","Assinale a FALSA sobre anestésicos locais:",["Prilocaína 3% com felipressina é a droga mais segura para gestantes","Lidocaína 2% com epinefrina é a droga padrão-ouro","Mepivacaína 3% sem vasoconstritor tem ação curta em polpa","Articaína tem alta difusão, mas risco de parestesia no bloqueio do NAI"],"A afirmativa sobre a prilocaína com felipressina é falsa: ela é evitada em gestantes pelo efeito ocitócico da felipressina e pelo risco de metemoglobinemia."],
["Anestesiologia","Qual vantagem do vasoconstritor no anestésico local?",["Aumenta a duração e reduz a toxicidade sistêmica e o sangramento","Diminui a duração do efeito e acelera a recuperação da sensibilidade","Aumenta a absorção do anestésico para o sangue e a sua toxicidade","Elimina o risco de qualquer reação adversa, inclusive alergias"],"O vasoconstritor reduz o fluxo sanguíneo local: o anestésico fica mais tempo no local (mais duração e profundidade), há menos absorção sistêmica (menos toxicidade) e melhor hemostasia."],
["Clínica Integrada","Na anamnese, a paciente relata que é cardiopata com prótese valvar. O que deve ser considerado antes de procedimentos com sangramento?",["Profilaxia antibiótica para endocardite infecciosa","Nenhuma precaução, pois a prótese valvar não traz riscos","Suspender toda a medicação cardíaca antes do atendimento","Fazer o tratamento apenas sob anestesia geral hospitalar"],"Prótese valvar é condição de alto risco para endocardite infecciosa. Procedimentos com manipulação gengival ou periapical exigem profilaxia antibiótica (ex.: amoxicilina 2 g, 30–60 min antes, em adultos)."],
["Clínica Integrada","Na fase de adequação do meio bucal, o que se faz?",["Controle do biofilme, raspagem, selamento de cavidades ativas e flúor","Confecção das coroas e próteses definitivas logo na primeira consulta","Clareamento dental e facetas estéticas antes de controlar as doenças","Apenas a consulta de manutenção semestral, sem outros procedimentos"],"A adequação elimina as causas da doença e a controla: orientação de higiene, raspagem, selamento das lesões ativas (ex.: com CIV), exodontia de dentes sem condição e flúor. Os procedimentos definitivos vêm depois da reavaliação."]
]},
{ nome: "Prova 3", questoes: [
["Endodontia","Analise sobre a anestesia na urgência endodôntica: I – Mesmo com anestesia adequada dos tecidos moles, pode não haver anestesia pulpar suficiente na pulpite irreversível. II – A persistência da dor não deve ser interpretada sempre como falha técnica. III – A anestesia intrapulpar pode ser alternativa quando as técnicas anteriores não controlam a dor. IV – Com dor pulpar, deve-se continuar o procedimento, pois novas anestesias aumentam o risco de toxicidade. A sequência correta é:",["V – V – V – F","V – F – V – F","F – V – V – V","V – V – F – V"],"I, II e III são verdadeiras: a inflamação reduz a eficácia do anestésico, e existem técnicas complementares. IV é falsa: não se trabalha com o paciente sentindo dor; complementa-se a anestesia respeitando a dose máxima."],
["Endodontia","Dor provocada pelo frio, aguda e de curta duração, que some logo após remover o estímulo. Sem dor espontânea e percussão negativa. Diagnóstico pulpar:",["Pulpite reversível","Pulpite irreversível sintomática","Necrose pulpar","Pulpite irreversível assintomática"],"Dor provocada, rápida e que cessa ao remover o estímulo, sem dor espontânea, caracteriza pulpite reversível. Removendo a causa (cárie, restauração infiltrada), a polpa volta ao normal."],
["Endodontia","Qual a conduta para pulpite reversível causada por cárie?",["Remover a cárie e restaurar com proteção adequada","Pulpectomia imediata, com medicação intracanal","Exodontia do dente, pois a polpa já está inflamada","Antibiótico sistêmico e retorno em 7 dias"],"Na pulpite reversível, a polpa pode se recuperar. Remove-se a causa (cárie ou restauração infiltrada), protege-se o complexo dentino-pulpar e restaura-se. Não há indicação de tratamento endodôntico."],
["Endodontia","Na odontometria, um dente tem CAD de 23 mm. A lima, colocada no CRI, aparece 2 mm aquém do ápice no RX. Qual o CRT, trabalhando 1 mm aquém?",["21 mm","20 mm","22 mm","19 mm"],"CRI = 23 − 3 = 20 mm. A lima ficou 2 mm aquém, então CRD = 20 + 2 = 22 mm. CRT = 22 − 1 = 21 mm."],
["Endodontia","Qual estrutura delimita o limite apical do preparo e da obturação (cerca de 1 mm aquém do ápice radiográfico)?",["Constrição apical (CDC)","Forame apical lateral","Junção amelocementária","Teto da câmara pulpar"],"A constrição apical, próxima à junção cemento-dentina-canal (CDC), fica em média 0,5 a 1 mm aquém do ápice radiográfico. É o limite biológico ideal para instrumentar e obturar."],
["Endodontia","Qual o objetivo do selamento coronário provisório entre as sessões?",["Evitar a infiltração de saliva e bactérias no canal","Permitir a drenagem contínua do canal até a próxima consulta","Substituir a restauração definitiva por tempo indeterminado","Aumentar a sensibilidade do dente para facilitar os testes"],"A infiltração coronária recontamina o sistema de canais. Um selamento bem feito (ex.: CIV ou material provisório com espessura adequada) é fundamental para o sucesso."],
["Periodontia","Analise sobre o espaço biológico: I – É formado pela inserção conjuntiva e pelo epitélio juncional, acima da crista óssea. II – A violação por restaurações subgengivais profundas pode causar inflamação crônica, migração do epitélio juncional e perda óssea localizada. III – Pode ser recuperado por aumento de coroa clínica. A sequência é:",["V – V – V","V – F – V","F – V – V","V – V – F"],"As três são verdadeiras. Quando uma margem invade o espaço biológico, o aumento de coroa clínica (remoção de gengiva e osso) restabelece a distância e permite restaurar sem agredir o periodonto."],
["Periodontia","Paciente fumante de 15 cigarros por dia com periodontite. Pela classificação de 2017, o tabagismo:",["Eleva o grau para C","Mantém o grau em A","Não altera o grau","Eleva só o estágio"],"Tabagismo é modificador de grau: < 10 cigarros/dia → Grau B; ≥ 10 cigarros/dia → Grau C."],
["Periodontia","Qual o principal fator etiológico da gengivite?",["Biofilme dental","Trauma oclusal","Deficiência de vitamina C apenas","Uso de escova macia"],"A gengivite induzida por biofilme é a forma mais comum. Remover o biofilme reverte a inflamação, pois na gengivite não há perda de inserção."],
["Periodontia","Na extensão da periodontite (2017), quando é ‘generalizada’?",["Quando 30% ou mais dos dentes são afetados","Quando 10% ou mais dos dentes são afetados","Quando só os primeiros molares são afetados","Quando só um dente apresenta perda óssea"],"Localizada: menos de 30% dos dentes. Generalizada: 30% ou mais. Há ainda o padrão molar/incisivo."],
["Prótese","Paciente perdeu 35, 36 e 37 (lado esquerdo) e 45 (lado direito, com 44 e 46 presentes). Classe de Kennedy:",["Classe II, modificação 1","Classe III, modificação 1","Classe I, modificação 1","Classe II, sem modificação"],"O espaço mais posterior define a classe: extremidade livre unilateral (35–37) = Classe II. O espaço intercalado do 45 é um espaço adicional: modificação 1."],
["Prótese","Segundo a regra de Applegate, quando deve ser feita a classificação de Kennedy?",["Depois do preparo de boca, pois extrações podem mudar a classe","Antes de qualquer exame clínico ou radiográfico do paciente","Somente depois que a prótese já estiver instalada e ajustada","Antes das extrações planejadas, para registrar o estado inicial"],"Extrações planejadas mudam o desenho do arco. Por isso a classificação vem depois do preparo de boca, de acordo com o que realmente será reabilitado."],
["Prótese","Na classificação de Kennedy, o que define a classe?",["O espaço protético mais posterior","A extensão do maior espaço","O número total de dentes perdidos","A idade do paciente"],"A classe é definida pelo espaço mais posterior. Os outros espaços viram modificações (números arábicos). O tamanho do espaço não define a classe, e sim sua localização."],
["Prótese","Qual componente da PPR resiste ao deslocamento da prótese no sentido oclusal?",["Grampo de retenção","Apoio oclusal","Conector maior","Plano guia"],"O braço de retenção do grampo, com sua ponta abaixo do equador protético, resiste ao deslocamento oclusal. O apoio resiste à intrusão (deslocamento em direção aos tecidos)."],
["Cirurgia","Qual a sequência dos tempos cirúrgicos fundamentais de uma exodontia?",["Diérese, exérese e síntese","Síntese, diérese e exérese","Exérese, síntese e diérese","Hemostasia, síntese e diérese"],"Diérese: incisão e descolamento (abrir). Exérese: remoção do dente. Síntese: sutura (fechar). A hemostasia acompanha todos os tempos."],
["Cirurgia","Qual destes é sinal de infecção odontogênica com repercussão sistêmica, que justifica antibiótico?",["Febre, trismo e edema extraoral","Dor leve e passageira após raspagem","Sensibilidade dentinária ao frio","Pequena úlcera traumática na bochecha"],"Antibiótico é indicado quando há sinais de disseminação ou repercussão sistêmica: febre, mal-estar, linfadenopatia, trismo ou edema extraoral, sempre junto com o tratamento local (drenagem, acesso, exodontia)."],
["Cirurgia","Em paciente com anticoagulante, qual medida local ajuda na hemostasia após exodontia?",["Ácido tranexâmico (bochecho ou compressa) e sutura","Ácido acetilsalicílico no pós-operatório imediato","Bochechos vigorosos com água morna nas primeiras horas","Deixar o alvéolo sem sutura para drenar o sangue"],"O ácido tranexâmico é antifibrinolítico e estabiliza o coágulo. Junto com sutura, esponja hemostática e compressão, permite exodontias seguras sem suspender o anticoagulante."],
["Cirurgia","Qual a função principal da sindesmotomia?",["Romper as fibras gengivais que prendem o dente à gengiva","Fraturar a raiz para facilitar a remoção com o fórceps","Aproximar as bordas do alvéolo no fim da cirurgia","Remover osso com broca para expor a raiz do dente"],"A sindesmotomia desinsere as fibras gengivais em volta do colo do dente. Isso evita dilacerar a gengiva e permite posicionar o fórceps mais apicalmente."],
["Restauradora","Qual o sistema de classificação visual de lesões de cárie que vai de 0 a 6?",["ICDAS","Classificação de Black","Kennedy","Pell & Gregory"],"O ICDAS classifica de 0 (hígido) a 6 (cavidade extensa com dentina visível). Códigos 1–2: alterações em esmalte; 3: microcavidade; 4: sombreamento de dentina; 5–6: cavidade em dentina."],
["Restauradora","Hipomineralização molar-incisivo (HMI) caracteriza-se por:",["Opacidades demarcadas e assimétricas em molares e incisivos, que podem fraturar","Manchas difusas e simétricas em homólogos, por ingestão excessiva de flúor","Perda de estrutura em faixas horizontais simétricas, por alteração na formação","Manchas brancas apenas na cervical, causadas por acúmulo de biofilme"],"Na HMI as opacidades são bem demarcadas (branco, creme ou marrom), assimétricas, em primeiros molares e incisivos. O esmalte é poroso, pode fraturar após a erupção e causar sensibilidade."],
["Restauradora","Qual a principal vantagem do cimento de ionômero de vidro (CIV)?",["Adesão química ao dente e liberação de flúor","Maior resistência mecânica que a resina","Estética superior à resina composta","Não sofrer sinérese nem embebição"],"O CIV adere quimicamente ao esmalte e à dentina e libera flúor. Por outro lado, tem menor resistência e é sensível à umidade (sinérese e embebição) nas fases iniciais."],
["Anestesiologia","Qual técnica anestesia o nervo alveolar inferior, o lingual e os dentes inferiores de um lado?",["Bloqueio pterigomandibular (alveolar inferior)","Infiltrativa na papila interdental do 46","Bloqueio do nervo nasopalatino no palato","Infiltrativa no fundo de sulco do canino 13"],"O bloqueio do alveolar inferior (técnica pterigomandibular) anestesia os dentes inferiores do lado, a gengiva vestibular de pré-molares a incisivos (via mentual), o lábio, e o lingual (2/3 anteriores da língua e gengiva lingual)."],
["Anestesiologia","Antes de injetar o anestésico, o que é essencial para evitar injeção intravascular?",["Aspiração prévia","Injeção rápida","Agulha sem bisel","Aquecer o tubete na chama"],"A aspiração verifica se a agulha está dentro de um vaso. Se vier sangue, reposiciona-se. A injeção deve ser lenta (cerca de 1 mL por minuto)."],
["Clínica Integrada","Qual informação NÃO faz parte obrigatória da anamnese?",["A cor preferida da escova de dentes","Medicamentos de uso contínuo","Alergias a fármacos e ao látex","Doenças sistêmicas e internações"],"A anamnese registra queixa principal, história médica, medicamentos, alergias, cirurgias, hábitos e histórico odontológico, para guiar o diagnóstico e a segurança do atendimento."],
["Clínica Integrada","Paciente com dor intensa no 46 e várias lesões de cárie. Qual a prioridade do primeiro atendimento?",["Resolver a urgência (dor) e a queixa principal","Fazer todas as restaurações estéticas anteriores","Moldar o paciente para a prótese definitiva","Fazer o clareamento antes de qualquer outra etapa"],"A primeira fase é a urgência: controle de dor, infecção e fraturas, resolvendo a queixa principal. Só depois vêm adequação, reavaliação e fase definitiva."]
]},
{ nome: "Prova 4", questoes: [
["Endodontia","Caso: homem, 45 anos, dor espontânea no 26 há 2 dias, que acorda o paciente à noite. Frio: dor intensa que permanece por mais de 30 segundos. Percussão negativa. RX: cárie profunda, periápice normal. Diagnóstico:",["Pulpite irreversível sintomática com tecidos apicais normais","Pulpite reversível com periodontite apical sintomática","Necrose pulpar com periodontite apical assintomática","Abscesso apical agudo"],"Dor espontânea e noturna, prolongada após o frio, indica pulpite irreversível sintomática. Percussão negativa e periápice normal mostram que a inflamação ainda não chegou aos tecidos apicais."],
["Endodontia","Periodontite apical assintomática caracteriza-se por:",["Radiolucidez periapical, sem sintomas, em dente com necrose","Dor intensa à percussão, com edema extraoral e febre","Resposta exagerada e prolongada ao frio, com dor noturna","Fístula ativa com drenagem de pus pela gengiva vestibular"],"É uma inflamação crônica do periápice em dente com necrose, que aparece como radiolucidez apical, sem dor. Se houver fístula, o diagnóstico passa a ser abscesso apical crônico."],
["Endodontia","Qual teste ajuda a diferenciar dor de origem pulpar de dor de origem periodontal/periapical?",["Percussão vertical e palpação apical","Teste com fio dental entre os dentes","Hemograma completo e glicemia","Moldagem de estudo em alginato"],"Percussão e palpação positivas indicam envolvimento dos tecidos periapicais. Os testes térmicos avaliam a polpa. Os dois juntos orientam o diagnóstico."],
["Endodontia","Na abertura coronária de um molar inferior, qual a forma de contorno esperada?",["Trapezoidal, com base maior para mesial","Triangular com base para incisal","Circular centralizada na cúspide distal","Ovalada no sentido vestíbulo-lingual na face lingual"],"Nos molares inferiores, a abertura é trapezoidal, com base maior voltada para mesial (onde ficam os canais MV e ML) e menor para distal. Nos superiores, triangular com base para vestibular."],
["Endodontia","Durante o preparo químico-mecânico, a irrigação abundante serve para:",["Remover detritos, lubrificar e desinfetar o canal","Selar os túbulos dentinários de forma definitiva","Substituir a instrumentação","Aumentar o tamanho do forame apical"],"A irrigação remove raspas de dentina e restos de tecido, lubrifica os instrumentos e atua contra microrganismos. Ela complementa a instrumentação, sem substituí-la."],
["Endodontia","Quando o tratamento endodôntico NÃO é concluído na consulta de urgência, o dente deve:",["Receber desinfecção, medicação intracanal e selamento","Ficar aberto para drenar até a próxima sessão","Ser obturado de qualquer jeito na mesma sessão","Ficar só com algodão seco, sem material selador"],"Não sendo possível concluir, faz-se a desinfecção possível, coloca-se medicação intracanal (hidróxido de cálcio) e sela-se bem a coroa até a próxima sessão."],
["Periodontia","Qual a diferença entre profundidade de sondagem (PS) e nível clínico de inserção (NIC)?",["A PS é medida a partir da margem gengival; o NIC, a partir da JCE","A PS é medida a partir da JCE; o NIC, a partir da margem gengival","São a mesma medida, apenas com nomes diferentes em cada escola","O NIC só pode ser medido em radiografia, nunca com a sonda"],"A PS vai da margem gengival ao fundo da bolsa. O NIC vai da JCE (referência fixa) ao fundo da bolsa, por isso mostra a perda de inserção real."],
["Periodontia","Paciente com periodontite e perda de 6 dentes por causa dela, mobilidade grau 2 e colapso de mordida. Estágio provável:",["Estágio IV","Estágio I","Estágio II","Estágio III"],"Perda de 5 ou mais dentes por periodontite, disfunção mastigatória, mobilidade grau 2 ou 3 e necessidade de reabilitação complexa caracterizam o Estágio IV."],
["Periodontia","O ligamento periodontal tem várias funções. Qual NÃO é uma delas?",["Produzir esmalte dentário","Amortecer as forças mastigatórias","Formar células como fibroblastos e cementoblastos","Nutrir e dar sensibilidade proprioceptiva"],"O ligamento tem funções de suporte e amortecimento, formativa, nutritiva e sensorial. O esmalte é produzido pelos ameloblastos durante a formação do dente."],
["Periodontia","Em pacientes já tratados, o estágio da periodontite:",["Não deve ser rebaixado","Deve voltar para Estágio I","É apagado após a raspagem","Sobe automaticamente"],"Pela classificação de 2017, a perda de inserção é um dano histórico. Depois do tratamento, o estágio não diminui; o paciente passa a ser um paciente periodontal tratado, em manutenção."],
["Prótese","Paciente com ausência de 17, 16, 26 e 27, terceiros molares ausentes e não repostos. Classe de Kennedy:",["Classe I","Classe II","Classe III","Classe IV"],"Sem nenhum dente posterior aos espaços dos dois lados, há extremidades livres bilaterais: Classe I. O espaço dos terceiros molares não conta (Applegate)."],
["Prótese","Qual a função do plano guia na PPR?",["Definir uma trajetória de inserção e remoção única","Apoiar a prótese e impedir a intrusão nos tecidos","Unir os componentes dos dois lados da prótese","Fixar os dentes artificiais na sela de resina"],"Os planos guia são superfícies paralelas preparadas nos pilares. Eles definem a trajetória de inserção, ajudam na estabilidade e na retenção friccional."],
["Prótese","Na prótese total, o que acontece se a dimensão vertical de oclusão ficar muito aumentada?",["Fadiga muscular, dor e contato dos dentes ao falar","Aparência envelhecida com comissuras caídas","Queilite angular por falta de altura facial","Mais conforto mastigatório e melhor estética"],"DVO aumentada invade o espaço funcional livre: os dentes batem ao falar, há dor, fadiga muscular e reabsorção do rebordo. DVO diminuída dá aparência envelhecida e pode causar queilite angular."],
["Prótese","Qual método pode ajudar a determinar a dimensão vertical de oclusão?",["Método fonético (sons sibilantes) e métrico (Willis)","Teste de vitalidade pulpar dos dentes remanescentes","Sondagem periodontal de seis sítios por dente","Teste de percussão vertical e horizontal"],"DVO pode ser estimada por métodos métricos (compasso de Willis), fonéticos (sons ‘S’), estéticos, de deglutição e pela DVR menos o espaço funcional livre."],
["Cirurgia","Qual o fórceps indicado para molares superiores do lado direito?",["Fórceps 18R","Fórceps 151","Fórceps 69","Fórceps 17"],"18R: molares superiores direitos; 18L: esquerdos (a ponta da cúspide se encaixa na furca vestibular). 17: molares inferiores. 151: pré-molares e raízes inferiores. 69: raízes e restos radiculares."],
["Cirurgia","Paciente com edema de face, febre de 38,5 °C e trismo após dor no 37. Conduta:",["Tratar o foco (drenagem) e antibiótico sistêmico","Apenas analgésico e esperar o edema regredir","Apenas bochechos com clorexidina por 7 dias","Restaurar o dente e liberar sem retorno"],"Com sinais sistêmicos (febre, trismo, edema extraoral), o antibiótico entra junto com o tratamento local (drenagem e remoção da causa). Ficar só com o antibiótico, sem resolver a causa, não funciona."],
["Cirurgia","Qual cuidado é necessário antes de exodontia em paciente diabético?",["Verificar o controle glicêmico e evitar jejum prolongado","Pedir que suspenda a insulina no dia da cirurgia","Usar sempre anestésico sem vasoconstritor em diabéticos","Nenhum cuidado, pois diabetes não interfere na cirurgia"],"Avalia-se a glicemia e o controle (HbA1c). O paciente deve estar alimentado e ter usado a medicação habitual, para evitar hipoglicemia. Diabéticos descompensados cicatrizam pior e têm mais infecção."],
["Cirurgia","Qual alteração indica fratura da tuberosidade maxilar durante a exodontia de um molar superior?",["O osso se move junto com o dente e o rebordo","Sangramento leve, igual ao de qualquer exodontia","Dor ao frio no dente vizinho durante a luxação","Parestesia no lábio inferior do mesmo lado"],"Quando a tuberosidade se move junto com o dente, há risco de fratura. Deve-se parar, estabilizar e, se necessário, separar o dente do osso antes de removê-lo."],
["Restauradora","Qual a principal desvantagem do hidróxido de cálcio como material de proteção?",["Não adere, é solúvel e tem baixa resistência","Não tem nenhuma ação antimicrobiana na cavidade","É tóxico quando colocado em contato com a polpa","Escurece o dente de forma permanente e visível"],"O hidróxido de cálcio é biocompatível, antimicrobiano e estimula a dentina reparadora, mas não adere, é muito solúvel e tem baixa resistência. Por isso é coberto com CIV."],
["Restauradora","Restauração em resina com contato prematuro após o ajuste. Como identificar e corrigir?",["Marcar com carbono e desgastar com ponta diamantada F ou FF","Remover toda a restauração e refazê-la em todos os casos","Deixar como está, pois o contato se ajusta com a mastigação","Acrescentar resina para aumentar o volume da restauração"],"O contato prematuro deixa a restauração ‘alta’. Marca-se com papel carbono em MIH e nos movimentos excursivos e desgasta-se com ponta diamantada F ou FF, depois polimento."],
["Restauradora","Na lateralidade em oclusão mutuamente protegida, qual dente guia o movimento?",["O canino (guia canino)","O primeiro molar","Os incisivos centrais","O terceiro molar"],"Na guia canino, o canino do lado de trabalho desoclui os posteriores. Quando pré-molares e molares participam, é função em grupo. Os incisivos não devem tocar na lateralidade."],
["Anestesiologia","Paciente com hipertensão controlada. Qual a orientação sobre vasoconstritor?",["Usar epinefrina em dose reduzida, com aspiração e injeção lenta","Não usar nenhum anestésico local, mesmo com a pressão controlada","Usar o dobro da dose de epinefrina para garantir a hemostasia","Usar só prilocaína com felipressina, sem limite de tubetes"],"Hipertensos controlados podem receber anestésico com epinefrina em dose reduzida (ex.: até 2 tubetes com 1:100.000), sempre com aspiração e injeção lenta. Hipertensos descompensados devem ser encaminhados."],
["Anestesiologia","Qual o primeiro sinal de toxicidade por anestésico local no sistema nervoso central?",["Agitação, gosto metálico, zumbido e tremores","Bradicardia isolada, sem nenhum outro sinal","Urticária generalizada e coceira na pele","Febre alta e calafrios após 24 horas"],"A sobredose de anestésico costuma começar com excitação do SNC: agitação, gosto metálico, zumbido, tremores, podendo evoluir para convulsão e depois depressão. Urticária sugere alergia."],
["Clínica Integrada","Na ficha da clínica, o que deve ser marcado em verde no odontograma?",["Dentes já tratados e em bom estado","Dentes com cárie ativa","Dentes indicados para exodontia","Dentes com mobilidade"],"Pelas normas da clínica, o odontograma é feito a lápis até o professor conferir. Dentes já tratados e em bom estado são indicados em verde."],
["Clínica Integrada","Qual a ordem recomendada para começar o plano de tratamento, depois das urgências?",["Dos procedimentos mais simples para os mais complexos","Sempre dos procedimentos mais complexos para os simples","Em ordem numérica dos dentes, do 18 até o 48","Pelo dente com a restauração mais antiga da boca"],"Pelas normas de aula, após as urgências, começa-se pelos procedimentos mais fáceis e segue-se para os mais difíceis, conferindo o planejamento com o professor."]
]},
{ nome: "Prova 5", questoes: [
["Endodontia","Analise sobre a conduta de urgência em pulpite irreversível: I – A remoção do tecido pulpar inflamado (pulpectomia) é a conduta mais coerente. II – Antibiótico sozinho resolve a dor da pulpite. III – Manter o dente aberto entre consultas é recomendado. IV – O selamento coronário evita recontaminação. A sequência correta é:",["V – F – F – V","V – V – F – V","F – F – V – V","V – F – V – F"],"I e IV são verdadeiras. II é falsa: a pulpite é inflamação, não infecção sistêmica, e antibiótico não tira a dor. III é falsa: o dente aberto se contamina com saliva."],
["Endodontia","Dente com resposta ao frio normal, percussão positiva e sem cárie, após o paciente colocar uma restauração ‘alta’ há 2 dias. Causa provável:",["Trauma oclusal inflamando o periodonto apical","Necrose pulpar com abscesso apical agudo","Pulpite irreversível sintomática","Cisto periapical em crescimento"],"Com polpa vital (frio normal) e percussão positiva após uma restauração alta, a causa provável é trauma oclusal. O ajuste oclusal costuma resolver."],
["Endodontia","Qual a diferença entre abscesso apical agudo e crônico?",["O agudo tem dor intensa e edema; o crônico drena por fístula, quase sem dor","O agudo drena por fístula; o crônico tem dor intensa e edema extraoral","Os dois acontecem em dentes com polpa vital e resposta normal ao frio","O crônico causa febre alta e trismo; o agudo é sempre assintomático"],"Agudo: necrose, dor intensa, edema, possível febre. Crônico: necrose com drenagem contínua (fístula), geralmente sem dor."],
["Endodontia","Após odontometria, CRD = 20 mm. Qual o CRT trabalhando 1 mm aquém?",["19 mm","20 mm","21 mm","17 mm"],"CRT = CRD − 1 mm = 19 mm."],
["Endodontia","Qual teste diferencia um dente com polpa vital de um com necrose?",["Teste de sensibilidade ao frio","Percussão horizontal do dente","Sondagem periodontal de 6 sítios","Palpação dos linfonodos cervicais"],"Os testes de sensibilidade (frio, calor, elétrico) avaliam a resposta da polpa. Percussão e palpação avaliam o periápice e o periodonto."],
["Endodontia","Pasta de hidróxido de cálcio como medicação intracanal: qual propriedade explica sua ação antimicrobiana?",["pH alto, pela liberação de íons hidroxila","pH ácido, que dissolve a dentina infectada","Ação anestésica local sobre o periápice","Ser radiolúcido e fácil de ver no RX"],"A liberação de íons hidroxila (OH⁻) eleva o pH para cerca de 12,5, o que é letal para a maioria das bactérias e inativa endotoxinas. Os íons cálcio favorecem o reparo."],
["Periodontia","Analise sobre bolsas: I – A bolsa periodontal tem migração apical do epitélio juncional. II – A bolsa gengival é chamada de falsa bolsa. III – A bolsa gengival tem perda óssea. A sequência é:",["V – V – F","V – F – V","F – V – V","V – V – V"],"I e II são verdadeiras. III é falsa: a bolsa gengival (falsa) não tem perda de inserção nem perda óssea; a profundidade aumenta pelo crescimento da gengiva."],
["Periodontia","Paciente com perda de inserção de 3 a 4 mm no pior sítio, PS até 5 mm, perda óssea horizontal no terço coronal e nenhum dente perdido por periodontite. Estágio:",["Estágio II","Estágio I","Estágio III","Estágio IV"],"Estágio II: perda de inserção interproximal de 3–4 mm, PS até 5 mm, perda óssea horizontal no terço coronal, sem perda dentária por periodontite."],
["Periodontia","Na raspagem e alisamento radicular, qual instrumento é próprio para uma face específica do dente?",["Cureta Gracey","Cureta universal","Foice (sickle)","Sonda OMS"],"As curetas Gracey são área-específicas (cada número para uma região/face). As universais servem para todas as faces. A sonda OMS é para medir e não para raspar."],
["Periodontia","Por que o paciente periodontal precisa de manutenção periódica?",["Porque o biofilme volta a se acumular e a doença pode recidivar","Porque a periodontite tratada nunca mais volta, mas é protocolo","Para trocar todas as restaurações a cada mês, por segurança","Porque a raspagem destrói o osso e precisa ser corrigida"],"A terapia de suporte (manutenção a cada 3 a 6 meses, conforme o risco) mantém o controle do biofilme e detecta cedo qualquer recidiva."],
["Prótese","Paciente com ausência de 34, 35 e 36, presença do 37, e ausência do 44 com 43 e 45 presentes. Classe de Kennedy:",["Classe III, modificação 1","Classe II, modificação 1","Classe I","Classe IV"],"Os dois espaços são intercalados (há dente posterior aos dois). O espaço mais posterior é intercalado: Classe III. O outro espaço é a modificação 1."],
["Prótese","Qual componente da PPR evita o deslocamento horizontal da prótese?",["Braço de oposição e conectores menores","Apenas a sela de resina acrílica","Apenas os dentes artificiais da prótese","Nenhum componente, só a saliva"],"O braço de oposição (recíproco) neutraliza as forças do braço de retenção e, com os conectores menores e planos guia, dá estabilidade contra deslocamentos horizontais."],
