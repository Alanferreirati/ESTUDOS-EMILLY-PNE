["Lesões bucais na infância","Sobre a estomatite aftosa recorrente (afta) menor, assinale a correta:",["Úlceras rasas (< 1 cm) e dolorosas, que cicatrizam em 7–14 dias sem marca","Lesões grandes e profundas que sempre deixam cicatriz após semanas","Lesões causadas pelo vírus do herpes, precedidas por vesículas","Placas brancas que saem à raspagem e deixam a mucosa vermelha"],"Afta menor: pequena (< 1 cm), rasa, dolorosa, com halo vermelho e centro amarelado, cicatrizando em 7–14 dias sem marca. A maior é profunda e pode deixar cicatriz. A herpetiforme lembra herpes, mas não é viral."],
["Lesões bucais na infância","Na úlcera traumática em criança, qual a conduta principal?",["Remover o fator traumático e acompanhar a cicatrização","Fazer biópsia imediata em todos os casos, sem esperar","Prescrever antibiótico sistêmico por 7 dias seguidos","Fazer exodontia de todos os dentes próximos à úlcera"],"A úlcera traumática melhora quando o fator causador é removido (dente fraturado, aparelho, mordida). Se não cicatrizar em cerca de 2 semanas, reavaliar e investigar."],
["Lesões bucais na infância","Qual lesão fundamental corresponde a uma coleção de líquido pequena (até cerca de 3 mm)?",["Vesícula","Pápula","Mácula","Pústula"],"Mácula: mudança de cor. Pápula: pequena elevação sólida. Nódulo: lesão sólida profunda. Vesícula: pequena coleção líquida. Bolha: coleção líquida maior. Úlcera: perda de epitélio."],
["Manejo comportamental","Criança de 1 ano e meio (estágio sensório-motor). Qual estratégia é mais adequada?",["Frases curtas, pais presentes e estímulos visuais e sonoros","Explicações racionais e participação em pequenas decisões","Abordagem autônoma, com privacidade e foco na estética","Discussão detalhada sobre cada etapa do tratamento"],"No sensório-motor (0–2 anos) a criança aprende pelos sentidos e depende dos pais. Funcionam frases curtas, a presença dos responsáveis e estímulos visuais e sonoros."],
["Manejo comportamental","Na técnica dizer-mostrar-fazer, qual a sequência correta?",["Explicar com palavras simples, mostrar o instrumento e depois fazer","Fazer o procedimento primeiro e explicar tudo só no final","Mostrar o instrumento e já fazer, sem explicar para não assustar","Só explicar com palavras e nunca mostrar os instrumentos"],"Primeiro se explica com linguagem adequada à idade, depois se mostra (no dedo, na unha), e só então se faz exatamente o que foi mostrado. Isso reduz o medo do desconhecido."],
["Urgência e emergência","Na RCP de criança com um único socorrista, qual a relação compressão:ventilação?",["30:2","15:2","30:1","5:1"],"Um socorrista: 30 compressões para 2 ventilações. Dois socorristas: 15:2. A frequência é de 100 a 120 por minuto."],
["Urgência e emergência","Em um bebê de 8 meses, qual pulso deve ser avaliado?",["Braquial","Carotídeo","Radial","Temporal"],"Em lactentes (menos de 1 ano) o pescoço é curto e gordinho, então se avalia o pulso braquial, na face interna do braço. Em crianças maiores, o carotídeo."],
["Dentição decídua","Sobre a dentição decídua, analise: I – Com a erupção dos caninos, estabelece-se a guia de lateralidade. II – O longo eixo dos dentes decíduos é mais vertical que o dos permanentes. III – O arco de Baume tipo I tem diastemas. IV – O segundo levante de mordida acontece com a erupção dos primeiros molares decíduos. A sequência é:",["V – V – V – F","V – F – F – V","F – F – V – V","V – V – F – F"],"I, II e III são verdadeiras. IV é falsa: o primeiro levante de mordida acontece com os primeiros molares decíduos; o segundo, com os segundos molares decíduos."],
["Dentição decídua","Onde ficam os espaços primatas?",["Mesial dos caninos superiores e distal dos caninos inferiores","Distal dos caninos superiores e mesial dos caninos inferiores","Entre os incisivos centrais superiores e inferiores","Entre o primeiro e o segundo molar decíduo de cada lado"],"Os espaços primatas ficam na mesial dos caninos superiores e na distal dos caninos inferiores. Eles ajudam no ajuste da oclusão durante a troca."],
["Radiologia e diagnóstico","Paciente de 7 anos: 54, 64, 84 e 85 com lesões em dentina (ICDAS 5 e 6). Qual técnica radiográfica avalia melhor se há envolvimento pulpar e o periápice?",["Periapical","Apenas o exame visual","Panorâmica antes de qualquer outra","Telerradiografia"],"Para lesões extensas, com suspeita de envolvimento pulpar, a periapical mostra a relação com a polpa, as raízes, a rizólise, o periápice e o germe. Isso define se o tratamento será pulpar ou exodontia."],
["Prevenção e flúor","Molar permanente em erupção, com opérculo cobrindo parte da coroa e dificuldade de isolamento. Qual selante é mais indicado?",["Selante ionomérico","Selante resinoso","Amálgama","Nenhum: aguardar a erupção total para qualquer medida"],"Em dentes em erupção, sem isolamento possível, o selante ionomérico é a escolha: tolera melhor a umidade e libera flúor. Depois da erupção completa, pode-se trocar por selante resinoso."],
["Prevenção e flúor","Qual a quantidade de dentifrício fluoretado recomendada para crianças menores de 3 anos?",["Grão de arroz cru","Grão de ervilha","Escova inteira coberta","Nenhuma: só sem flúor até 6 anos"],"Menores de 3 anos: grão de arroz cru, de dentifrício com 1.000 a 1.500 ppm. De 3 a 6 anos: grão de ervilha. A escovação deve ser supervisionada pelos pais."],
["Terapia pulpar","Na pulpotomia de dente decíduo, o que é removido?",["Só a polpa coronária, mantendo a radicular vital","Toda a polpa, coronária e radicular, até o ápice","Só a dentina cariada, sem chegar a tocar na polpa","O dente inteiro, junto com o germe do sucessor"],"Na pulpotomia remove-se a polpa coronária inflamada e trata-se o remanescente radicular, que deve estar vital (sangramento controlável). Se a polpa radicular estiver comprometida, indica-se pulpectomia."],
["Terapia pulpar","Sobre o tratamento endodôntico em decíduos, analise: I – Segundos molares decíduos inferiores costumam ter 3 canais (2 mesiais e 1 distal). II – A forma de contorno é feita com broca troncocônica (ex.: Endo-Z), reproduzindo a anatomia. III – Usa-se a mesma medida de trabalho para todos os canais do molar. Está correto:",["I e II","I, II e III","Apenas III","II e III"],"III é falsa: cada raiz sofre rizólise diferente, então cada canal tem sua medida, respeitando o bisel de rizólise."],
["Cirurgia e anestesia","Quais fórceps fazem parte do kit infantil da lista de materiais?",["18R, 18L, 17 e universal 101","150, 151, 69 e 65","Somente o 101","Somente fórceps de adulto"],"A lista da disciplina pede fórceps infantis 18R, 18L, 17 e universal 101, além de alavancas Apical e Seldin infantis."],
["Cirurgia e anestesia","No bloqueio do alveolar inferior em criança, qual a diferença anatômica importante?",["O forame mandibular fica mais baixo, perto do plano oclusal","O forame fica bem acima do plano oclusal, como no idoso","Não existe forame mandibular formado na criança pequena","A agulha deve entrar pela face vestibular da mandíbula"],"Na criança, o forame mandibular fica mais baixo, na altura (ou abaixo) do plano oclusal. Por isso a punção é feita mais baixa que no adulto."],
["Trauma dentário","Criança de 9 anos com avulsão do 11 há 20 minutos; o dente foi guardado em leite. Conduta:",["Reimplantar, fazer contenção flexível e prescrever antibiótico","Não reimplantar, por ser criança","Reimplantar só depois de 24 horas","Fazer a endodontia fora da boca por 2 horas e depois reimplantar"],"Dente permanente avulsionado deve ser reimplantado o mais rápido possível, guardado em meio adequado (leite, soro, saliva). Faz-se contenção flexível e antibiótico (cerca de 7 dias), que ajuda a prevenir infecção e reabsorção externa."]
]},
{ nome: "Prova 3", questoes: [
["Farmacologia","Criança de 20 kg. Amoxicilina 20 mg/kg/dia, 8 em 8 horas, suspensão 125 mg/5 mL. Volume por dose:",["Cerca de 5,3 mL","Cerca de 2,6 mL","Cerca de 8 mL","Cerca de 16 mL"],"20 × 20 = 400 mg/dia. 125/5 = 25 mg/mL. 400 ÷ 25 = 16 mL/dia. 16 ÷ 3 ≈ 5,3 mL por dose."],
["Farmacologia","Criança de 12 kg. Ibuprofeno 50 mg/mL (1 gota = 5 mg), dose de 2 gotas/kg. Quantas gotas por dose?",["24 gotas","12 gotas","6 gotas","48 gotas"],"Na apresentação 50 mg/mL usa-se 2 gotas por kg: 2 × 12 = 24 gotas (120 mg, ou seja, 10 mg/kg)."],
["Farmacologia","Abaixo de qual idade o ibuprofeno é contraindicado?",["6 meses","2 anos","12 anos","14 anos"],"O ibuprofeno é contraindicado abaixo de 6 meses, por risco de hipersensibilidade, toxicidade gastrointestinal e alteração renal."],
["Farmacologia","Por quanto tempo prescrever analgésico após procedimento simples em criança (ex.: exodontia de decíduo com rizólise avançada)?",["Nas primeiras 24 horas, se houver previsão de dor, e reavaliar","Por 10 dias seguidos, sempre, para evitar qualquer dor","Nunca: criança não deve receber analgésico após o atendimento","Por 30 dias, de forma preventiva, até a cicatrização completa"],"Em criança, prescreve-se só nas primeiras 24 horas quando há previsibilidade de dor. Se a dor persistir, a criança deve ser reavaliada, porque em casos simples não deveria haver dor prolongada."],
["Farmacologia","O que caracteriza a analgesia preemptiva?",["O fármaco é dado antes do trauma tecidual, para prevenir a hiperalgesia","O fármaco é dado só quando a dor já está forte, depois do procedimento","É o uso de antibiótico antes do procedimento para evitar infecção","É a aplicação de anestésico tópico antes da punção com a agulha"],"Preemptiva: antes do trauma (ex.: cirurgia de supranumerário). Preventiva: depois do procedimento, antes de a dor começar. Perioperatória: começa antes e se mantém no pós-operatório."],
["Lesões bucais na infância","Bebê com pequenos nódulos esbranquiçados na rafe mediana do palato duro, de 1 a 3 mm. Hipótese e conduta:",["Pérolas de Epstein: observar e orientar","Candidíase: antifúngico por 14 dias","Herpes: aciclovir","Rânula: excisão cirúrgica"],"As pérolas de Epstein são restos epiteliais presos na fusão do palato, na rafe mediana. Aparecem em 60–85% dos bebês e regridem sozinhas: observar e orientar os pais."],
["Lesões bucais na infância","Aumento de volume azulado, translúcido, sobre a região de um dente prestes a erupcionar. Hipótese e conduta:",["Cisto de erupção: acompanhar","Mucocele: excisão imediata","Hemangioma: escleroterapia","Rânula: marsupialização"],"O cisto (ou hematoma) de erupção fica sobre o dente em erupção, com aspecto azulado ou arroxeado. Em geral se rompe sozinho com a erupção: a conduta é acompanhar."],
["Lesões bucais na infância","Aumento de volume azulado e flutuante no assoalho da boca de uma criança. Hipótese:",["Rânula","Mucocele de lábio inferior","Pérola de Epstein","Afta maior"],"A rânula é um fenômeno de extravasamento de muco no assoalho bucal (glândula sublingual), com aspecto de ‘barriga de rã’. Tratamento: excisão com a glândula envolvida e histopatológico."],
["Lesões bucais na infância","No tratamento da candidíase oral em bebê de 1 ano, qual a posologia do miconazol gel oral?",["1/4 de colher de chá (1,25 mL), 4 vezes ao dia, após as refeições","1 colher de sopa (15 mL), 1 vez por semana, antes de dormir","1/2 colher de chá (2,5 mL), 1 vez ao dia, por 3 dias apenas","Miconazol injetável, em dose única, aplicado no consultório"],"Bebês de 6 a 24 meses: 1/4 de colher de chá (1,25 mL) 4 vezes ao dia, após as refeições. A partir de 2 anos: 1/2 colher de chá (2,5 mL) 4 vezes ao dia. O tratamento segue por cerca de 14 dias."],
["Lesões bucais na infância","Gengivite associada à erupção dentária. Qual afirmação está correta?",["A erupção não justifica falta de higiene: o biofilme segue sendo o fator principal","A gengivite de erupção é fisiológica e não precisa de nenhuma higiene especial","Deve-se suspender a escovação na região até a erupção terminar","Sempre precisa de antibiótico, por causa da ruptura da gengiva"],"Durante a troca dentária a gengiva pode ficar alterada, mas o biofilme continua sendo o principal fator da inflamação. A conduta é orientar a higiene e acompanhar."],
["Lesões bucais na infância","Qual é sinal de alerta que pede investigação ou encaminhamento de uma lesão bucal em criança?",["Crescimento progressivo e persistência sem explicação","Úlcera traumática que cicatrizou em 7 dias","Pérola de Epstein em recém-nascido de 10 dias","Gengivite que melhorou após orientação de escovação"],"Sinais de alerta: crescimento progressivo, persistência, sangramento sem explicação, endurecimento, cor suspeita, dor persistente, assimetria e manifestações sistêmicas. Conduta: reavaliar, investigar e encaminhar."],
["Manejo comportamental","Criança de 9 anos (operatório concreto). Qual abordagem combina melhor?",["Explicações racionais, participação ativa e pequenas decisões","Apenas a presença dos pais e estímulos visuais e sonoros","Privacidade e foco na estética, como se fosse adolescente","Contenção física desde o início, para ganhar tempo"],"No operatório concreto (7–11 anos), a criança entende causa e efeito de forma concreta. Explicações lógicas e deixá-la participar de pequenas escolhas aumentam a cooperação."],
["Manejo comportamental","Adolescente de 14 anos (operatório formal). Qual abordagem é mais adequada?",["Abordagem autônoma, valorizando estética, autocuidado e privacidade","Histórias, fantoches e analogias infantis para explicar o tratamento","Frases curtas com estímulos sonoros e a presença constante dos pais","Contenção pelos pais e técnica de mão sobre a boca quando resistir"],"No operatório formal (12 anos ou mais) há pensamento abstrato. O adolescente quer ser tratado com autonomia, se preocupa com a aparência e valoriza a privacidade."],
["Urgência e emergência","Qual a frequência de compressões torácicas na RCP pediátrica?",["100 a 120 por minuto","60 a 80 por minuto","80 a 100 por minuto","140 a 160 por minuto"],"A frequência recomendada é de 100 a 120 compressões por minuto, deixando o tórax voltar totalmente entre as compressões."],
["Urgência e emergência","Na RCP de bebê com dois socorristas, qual técnica de compressão é indicada?",["Dois polegares, com as mãos envolvendo o tórax","Duas mãos sobrepostas no esterno, como no adulto","Um único dedo pressionando o abdômen do bebê","Compressões na lateral do pescoço, sobre a carótida"],"Em bebês, com dois socorristas, usa-se a técnica dos dois polegares com as mãos envolvendo o tórax. Com um socorrista, dois dedos no centro do tórax, logo abaixo da linha mamilar."],
["Dentição decídua","Qual a sequência mais comum de erupção dos decíduos?",["Incisivo central, incisivo lateral, 1º molar, canino, 2º molar","Incisivo central, canino, incisivo lateral, 1º molar, 2º molar","1º molar, incisivo central, incisivo lateral, canino, 2º molar","Canino, incisivos, molares"],"A sequência habitual é A, B, D, C, E: incisivos centrais, laterais, primeiros molares, caninos e segundos molares. Os inferiores geralmente erupcionam antes dos superiores."],
["Dentição decídua","Sobre os planos terminais dos segundos molares decíduos, qual é o mais favorável para uma oclusão Classe I nos permanentes?",["Degrau mesial","Degrau distal","Plano terminal reto sempre leva à Classe II","Nenhum influencia a oclusão"],"O degrau mesial (molar inferior mais para mesial) tende a levar à Classe I. O plano reto pode evoluir para Classe I ou topo a topo. O degrau distal tende à Classe II."],
["Radiologia e diagnóstico","No ICDAS, o código 3 corresponde a:",["Microcavidade em esmalte, sem dentina visível","Esmalte hígido, sem nenhuma alteração visível","Sombreamento escuro da dentina, sem cavidade","Cavidade extensa, com dentina visível no fundo"],"0: hígido. 1: mancha visível após secar. 2: mancha visível úmida. 3: microcavidade em esmalte. 4: sombreamento de dentina. 5: cavidade com dentina visível. 6: cavidade extensa."],
["Prevenção e flúor","Sobre o cariostático (diamino fluoreto de prata), assinale a correta:",["Paralisa lesões de cárie, mas escurece o tecido cariado","Clareia os dentes e remove manchas extrínsecas","Substitui qualquer restauração estética em anteriores","É usado como selante de fóssulas e fissuras hígidas"],"O diamino fluoreto de prata (30%) paralisa lesões ativas e tem ação antimicrobiana. Desvantagem principal: escurece a lesão. É útil em crianças pouco cooperativas e no controle de doença."],
["Prevenção e flúor","O aleitamento materno causa cárie?",["Sozinho não; o risco vem com açúcar, mamadas noturnas sem higiene e dentes","Sim, sempre, desde o nascimento, mesmo antes de existirem dentes na boca","Não, nunca, mesmo com consumo de açúcar e falta de higiene bucal","Só causa cárie se a mãe tiver cárie ativa e beijar a criança na boca"],"O leite materno sozinho não é o vilão. O risco vem da combinação de dentes presentes, consumo de açúcar, mamadas noturnas frequentes e falta de higiene."],
["Terapia pulpar","Durante a pulpotomia, a hemostasia é feita com:",["Compressão com bolinha de algodão","Bochecho com água morna","Hipoclorito em alta pressão no canal","Brocas em alta rotação no canal"],"Após remover a polpa coronária, faz-se hemostasia com bolinha de algodão estéril comprimindo os remanescentes. Sangramento que não para indica inflamação radicular e mudança para pulpectomia."],
["Terapia pulpar","Na pulpectomia de decíduo, após a obturação com pasta Guedes-Pinto, o que vem em seguida?",["Selar com guta-percha em bastão e restaurar","Deixar o dente aberto para drenar","Fazer a exodontia do dente tratado","Aplicar formocresol na câmara e liberar"],"Sequência das notas de aula: hemostasia com algodão → medicação e obturação com Guedes-Pinto → selamento com guta-percha em bastão → restauração."],
["Cirurgia e anestesia","Criança de 15 kg. Lidocaína 2% (36 mg por tubete), máximo 4,4 mg/kg. Quantos tubetes no máximo?",["Cerca de 1,8 tubete","Cerca de 4 tubetes","Cerca de 3,6 tubetes","Cerca de 0,5 tubete"],"4,4 × 15 = 66 mg. 66 ÷ 36 = 1,8 tubete."],
["Cirurgia e anestesia","Dente decíduo com retenção prolongada e o permanente já erupcionando por lingual. Conduta mais comum:",["Exodontia do decíduo retido","Aguardar até os 18 anos","Fazer pulpectomia do decíduo","Restaurar o decíduo"],"Na retenção prolongada, com o sucessor erupcionando fora de posição (ex.: incisivo inferior por lingual), indica-se exodontia do decíduo, para o permanente se posicionar."],
["Trauma dentário","Ao avaliar trauma dentário em criança, o que deve ser considerado?",["Dentição, idade, rizogênese, tipo de trauma e risco ao sucessor","Apenas a cor do dente na hora do atendimento","Apenas se houve sangramento no local do trauma","Somente o relato da escola sobre como aconteceu"],"O trauma é analisado pela dentição (decídua/permanente), idade, estágio de rizogênese, tipo de trauma, envolvimento pulpar, condição periodontal e risco de dano ao germe permanente."]
]},
{ nome: "Prova 4", questoes: [
["Farmacologia","Criança de 30 kg. Amoxicilina 20 mg/kg/dia, 8 em 8 horas, suspensão 250 mg/5 mL. Volume por dose:",["4 mL","12 mL","6 mL","2 mL"],"20 × 30 = 600 mg/dia. 250/5 = 50 mg/mL. 600 ÷ 50 = 12 mL/dia. 12 ÷ 3 = 4 mL por dose."],
["Farmacologia","Criança alérgica à penicilina precisa de antibiótico. Qual alternativa está nas notas de aula?",["Azitromicina, cefalexina, eritromicina ou claritromicina","Amoxicilina com ácido clavulânico em dose habitual","Ampicilina em suspensão oral de 8 em 8 horas","Amoxicilina em dose dobrada por 10 dias"],"Amoxicilina, amoxicilina + clavulanato e ampicilina são penicilinas. Para alérgicos: macrolídeos (azitromicina, eritromicina, claritromicina) ou cefalexina (com cautela), conforme o caso."],
["Farmacologia","Paciente em uso de antibiótico + tratamento local. Quando reavaliar?",["Após 2 a 3 dias, suspendendo se os sinais regredirem","Só ao fim de 21 dias, quando o frasco terminar","Nunca: o frasco deve ser usado até o fim sem retorno","Após 1 hora, para ver se a febre já baixou"],"Reavalia-se após 2–3 dias. Se os sinais sistêmicos regrediram, a terapia pode ser descontinuada. A recomendação atual é prescrever por 3 a 7 dias, com reavaliação, e não 7 dias de rotina."],
["Farmacologia","Sobre resistência bacteriana, assinale a correta:",["Aumentar a dose não garante eficácia; se não responder, muda-se o espectro","Dobrar a dose sempre resolve a resistência","Bactérias ficam resistentes por usar pouco o antibiótico só em casos graves","Antibiótico preventivo em toda consulta evita resistência"],"Elevar a dose não vence uma bactéria resistente. Se a medicação não resolve, muda-se o espectro (ex.: amoxicilina + clavulanato). O uso indiscriminado seleciona bactérias resistentes."],
["Farmacologia","Na receita para criança, quais dados do paciente são obrigatórios?",["Nome, idade, peso e endereço","Apenas o nome completo","Nome e nome da escola","Apenas o peso e a altura"],"Pelas notas: identificação do profissional (nome, CRO, endereço, telefone), do paciente (nome, idade, peso, endereço), dados do medicamento (nome, forma, dose, quantidade, posologia), data e assinatura."],
["Lesões bucais na infância","Na candidíase oral, qual é o primeiro passo citado nas notas de aula, além do antifúngico tópico?",["Higienizar a mucosa (clorexidina 0,12%) e investigar a causa","Antibiótico de amplo espectro por 7 dias seguidos","Cirurgia para remover as placas brancas da mucosa","Corticoide sistêmico para reduzir a inflamação"],"Higieniza-se a mucosa (clorexidina 0,12%), investiga-se a causa (antibiótico, imunossupressão, chupeta/mamadeira) e usa-se antifúngico tópico (nistatina, miconazol, V.A.S.A.) 4 vezes ao dia por 14 dias."],
["Lesões bucais na infância","Nistatina suspensão oral para lactentes com candidíase: qual a posologia?",["1 a 2 mL (100.000 a 200.000 UI), 4 vezes ao dia","10 mL (1.000.000 UI), 1 vez ao dia, por 3 dias","1 gota (10.000 UI) por semana, até sumir","5 mL (500.000 UI) a cada hora enquanto acordado"],"Lactentes: 1 a 2 mL (100.000 a 200.000 UI) 4 vezes ao dia. Crianças e adultos: 1 a 6 mL 4 vezes ao dia."],
["Lesões bucais na infância","Para afta (ulceração aftosa) em criança maior, qual medicamento tópico foi citado e por quanto tempo no máximo?",["Triancinolona orabase, 3 vezes ao dia, no máximo 7 dias","Amoxicilina em pomada, 2 vezes ao dia, por 30 dias","Aciclovir injetável, 1 vez ao dia, por 14 dias","Clorexidina 2% pura, aplicada 6 vezes ao dia, por 60 dias"],"Triancinolona (corticoide de média potência), aplicada na mucosa limpa e seca, 3 vezes ao dia, até 7 dias. Se não cicatrizar nesse prazo, reavaliar, pois o diagnóstico pode ser outro."],
["Lesões bucais na infância","Sobre a doença mão-pé-boca, assinale a correta:",["É contagiosa: saliva, secreções, fezes e objetos","Não é contagiosa e pode ir à escola normalmente","Acontece quase só em adultos acima de 40 anos","Precisa sempre de antibiótico por 10 dias"],"É muito contagiosa (saliva, secreções nasais, fezes, copos, brinquedos), com incubação de 3 a 6 dias. As lesões vão de mácula a pápula, vesícula e crosta. Tratamento de suporte: repouso, hidratação, analgésico."],
["Lesões bucais na infância","Bebê com rodetes gengivais (elevações das gengivas antes da erupção). Qual afirmativa é correta?",["São normais e não precisam de tratamento","São hiperplasias que exigem remoção cirúrgica","São sempre sinal de infecção","Indicam ausência dos germes dentários"],"Os rodetes gengivais são estruturas normais do rebordo do bebê, antes da erupção. Não há indicação de remoção."],
["Lesões bucais na infância","Dentes natais e neonatais: qual a diferença?",["Natais já estão presentes ao nascer; neonatais surgem no 1º mês","Natais erupcionam aos 6 meses; neonatais, por volta dos 12 meses","São sinônimos: os dois nomes indicam dentes presentes ao nascer","Neonatais são sempre supranumerários e devem ser extraídos"],"Natais: presentes ao nascer. Neonatais: erupcionam nos primeiros 30 dias. A maioria é dente decíduo normal (incisivos inferiores). Podem causar Riga-Fede; exodontia se muito móveis (risco de aspiração)."],
["Manejo comportamental","Qual estabilização é usada para examinar bebês, com responsável e profissional sentados frente a frente?",["Joelho a joelho","Contenção com macri","Sedação com óxido nitroso sempre","Exame na cadeira, sozinho"],"Na posição joelho a joelho, o responsável e o dentista sentam-se de frente. A cabeça do bebê fica apoiada no colo do profissional, e o responsável segura mãos e pernas. É usada para exame e procedimentos rápidos."],
["Manejo comportamental","Qual é um exemplo de reforço positivo?",["Elogiar logo após um comportamento cooperativo","Repreender a criança em voz alta quando ela chora","Prometer um brinde no início e não entregar no fim","Ignorar os bons comportamentos para não mimar"],"Reforço positivo é recompensar (elogio, adesivo, certificado de coragem) logo após o comportamento desejado, para que ele se repita."],
["Manejo comportamental","Por que trocar palavras como ‘agulha’, ‘sangue’ e ‘dor’ no atendimento infantil?",["Porque podem assustar e piorar o comportamento","Porque não existem em português","Porque a criança entende melhor termos técnicos","Porque os pais pedem"],"Termos que remetem a dor e a medo aumentam a ansiedade. Usa-se vocabulário substituto (ex.: ‘soninho no dente’, ‘chuveirinho’) e os instrumentais ficam fora da vista."],
["Urgência e emergência","Criança de 5 anos engasgada, consciente, sem conseguir tossir ou falar. Conduta:",["Compressões abdominais (Heimlich)","Golpes leves no rosto para assustar","Dar água para empurrar o objeto","Deitá-la de costas e esperar"],"Em crianças acima de 1 ano com obstrução grave e consciente, faz-se a manobra de Heimlich. Em bebês: 5 golpes nas costas + 5 compressões torácicas, alternados."],
["Urgência e emergência","Na RCP pediátrica, qual a profundidade das compressões?",["Cerca de 1/3 do diâmetro do tórax","Cerca de 1 cm, bem superficial","O máximo possível, sem nenhum limite","Cerca de metade do diâmetro do tórax"],"Comprime-se cerca de 1/3 do tórax (cerca de 4 cm em bebês e 5 cm em crianças), permitindo o retorno completo do tórax."],
["Dentição decídua","Qual característica é da dentição decídua?",["Câmara pulpar ampla e esmalte mais fino","Esmalte mais espesso que o dos permanentes","Raízes dos molares convergentes e curtas","Coroas mais amareladas que as permanentes"],"Os decíduos têm esmalte e dentina mais finos, câmara pulpar ampla, cornos pulpares altos, constrição cervical acentuada, coroas mais brancas e raízes dos molares divergentes (para abrigar o germe)."],
["Dentição decídua","Sobre o arco de Baume tipo II, assinale a correta:",["Não tem diastemas e tem maior risco de apinhamento","Tem diastemas amplos e é o mais favorável à troca","Só aparece no arco superior, nunca no inferior","É o mesmo que espaço primata, com outro nome"],"Tipo II: dentes encostados, sem diastemas. Como os permanentes são maiores, há menos espaço e maior chance de apinhamento."],
["Radiologia e diagnóstico","Lesão de mancha branca ativa em esmalte (ICDAS 1–2) em face livre. Conduta:",["Controle de biofilme, flúor e acompanhamento","Restauração imediata em resina composta","Exodontia do dente com mancha branca","Pulpotomia para evitar progressão da lesão"],"Lesão sem cavitação em esmalte pode ser paralisada e remineralizada: higiene, flúor (verniz) e dieta. Não precisa de restauração."],
["Prevenção e flúor","Erosão dentária em criança: qual orientação está correta?",["Reduzir bebidas ácidas e não escovar logo depois","Escovar com força logo após tomar refrigerante","Tomar suco de limão para fortalecer o esmalte","Tratar com antibiótico, pois a causa é bacteriana"],"A erosão é perda de estrutura por ácidos não bacterianos (refrigerantes, sucos cítricos, refluxo). Orienta-se reduzir a frequência, usar canudo, bochechar com água e esperar para escovar."],
["Prevenção e flúor","Tratamento Restaurador Atraumático (ART) envolve:",["Remoção da cárie com instrumentos manuais e restauração com CIV","Uso obrigatório de alta rotação, anestesia e isolamento absoluto","Restauração em amálgama após remoção com brocas em baixa rotação","Colocação de coroa de aço em todo dente com lesão de cárie"],"O ART remove o tecido cariado com curetas manuais, sem anestesia na maioria das vezes, e restaura com CIV de alta viscosidade. É útil para crianças pouco cooperativas e em saúde pública."],
["Terapia pulpar","Qual achado contraindica a pulpectomia em decíduo?",["Pouca raiz remanescente e cripta do germe rompida","Raiz com 2/3 do comprimento ainda presente","Polpa com sangramento vermelho vivo controlável","Pequena lesão de furca com cripta do germe íntegra"],"Contraindicam: reabsorção radicular extensa (menos de 2/3 de raiz), perfuração do assoalho, reabsorção interna extensa e envolvimento da cripta do germe. Nesses casos, indica-se exodontia."],
["Cirurgia e anestesia","Perda precoce de um molar decíduo com o sucessor ainda longe de erupcionar. Conduta:",["Avaliar a instalação de mantenedor de espaço","Não fazer nada, o espaço sempre se mantém","Extrair o dente vizinho","Colocar implante na criança"],"A perda precoce pode levar à migração dos vizinhos e à perda de espaço para o permanente. Avalia-se o mantenedor de espaço conforme a idade, o dente e o estágio do sucessor."],
["Cirurgia e anestesia","Qual anestésico local é considerado padrão na odontopediatria?",["Lidocaína 2% com epinefrina 1:100.000","Articaína 4% em menores de 4 anos","Bupivacaína 0,5% em todas as crianças","Prilocaína sem limite de dose"],"A lidocaína 2% com epinefrina é o padrão. Bupivacaína (longa duração) aumenta o risco de mordedura de lábio. Articaína não é recomendada abaixo de 4 anos."],
["Trauma dentário","Após o reimplante de um permanente avulsionado, por que prescrever antibiótico?",["Prevenir infecção e reduzir a reabsorção externa","Substituir a contenção flexível nos primeiros dias","Clarear o dente que escureceu após o trauma","Dispensar o tratamento endodôntico do dente"],"O antibiótico (cerca de 7 dias) aumenta a chance de sucesso: previne infecção e reduz a reabsorção radicular externa inflamatória."]

["Farmacologia","Betametasona em gotas, se indicada antes de procedimento invasivo, segue qual esquema?",["1 gota/kg em dose única, 1 hora antes do procedimento","1 gota a cada 2 kg, de 6 em 6 horas por 10 dias","10 gotas por dia durante 1 mês","Uso tópico na gengiva por 30 dias"],"Corticoide sistêmico é para casos específicos (especialista). Quando usado: 1 gota/kg em dose única, 1 hora antes. Evita-se se houver sinais de infecção ou imunossupressão."],
["Farmacologia","Sobre antimicrobiano tópico em feridas e lacerações contaminadas, o que foi citado?",["Clorexidina 0,12%, 2 vezes ao dia por 1 semana","Clorexidina 2% pura, 10 vezes ao dia por 1 mês","Antibiótico sistêmico em todos os casos, por 10 dias","Água oxigenada 10 volumes, sem diluir, 4 vezes ao dia"],"Para feridas contaminadas: clorexidina 0,12%, 2 vezes ao dia por 1 semana. Uso prolongado mancha os dentes e altera o paladar."],
["Lesões bucais na infância","Analise as colunas: 1 – Bebê de 4 meses, lesão esbranquiçada no ventre da língua, 71 e 81 erupcionados. 2 – Criança de 3 anos, febre, fotofobia e manchas de Koplik. 3 – Criança de 2 anos, crostas peribucais/nasais que começaram como pápulas. 4 – Criança de 8 anos, exantema no peito, amigdalite, língua vermelha e inchada. Associação correta:",["1 Riga-Fede; 2 sarampo; 3 impetigo; 4 escarlatina","1 sarampo; 2 impetigo; 3 escarlatina; 4 Riga-Fede","1 escarlatina; 2 Riga-Fede; 3 sarampo; 4 impetigo","1 impetigo; 2 escarlatina; 3 Riga-Fede; 4 sarampo"],"Riga-Fede: úlcera no ventre da língua por dentes natais/neonatais. Sarampo: manchas de Koplik. Impetigo: crostas melicéricas peribucais. Escarlatina: exantema, amigdalite e língua em framboesa."],
["Lesões bucais na infância","Sobre o exame do bebê, analise: I – Dentes natais erupcionam no primeiro mês e neonatais estão presentes ao nascer. II – Nódulos de Bohn ficam na rafe palatina. III – Rodetes gengivais indicam hiperplasia com indicação cirúrgica. IV – A estabilização joelho a joelho é um método de exame para bebês. A sequência é:",["F – F – F – V","V – V – F – V","V – F – F – V","F – V – V – F"],"I está invertida: natais ao nascer, neonatais no primeiro mês. II é falsa: na rafe estão as pérolas de Epstein; Bohn ficam nas faces dos rebordos. III é falsa: rodetes são normais. IV é verdadeira."],
["Lesões bucais na infância","Na mucocele de lábio inferior que não regride, qual a conduta?",["Excisão completa, com a glândula associada e histopatológico","Apenas antibiótico sistêmico e acompanhamento por 6 meses","Punção e aspiração repetidas, sem remover a glândula envolvida","Laser apenas na superfície e alta, sem exame do material"],"A excisão deve incluir a glândula menor envolvida, para evitar recidiva, e o material vai para exame histopatológico. Se houver um fator traumático, ele também deve ser removido."],
["Lesões bucais na infância","Criança com ‘bolinha azulada’ na boca. Quais hipóteses e o que considerar?",["Mucocele, rânula, cisto de erupção ou hematoma; ver idade, local e evolução","Só pode ser câncer bucal; encaminhar direto para oncologia pediátrica","É sempre pérola de Epstein, independentemente da idade e do local","Sempre candidíase; tratar com nistatina por 14 dias sem investigar"],"O diagnóstico diferencial de lesões azuladas inclui mucocele, rânula, cisto de erupção e hematoma. Idade, localização, consistência, evolução e relação anatômica orientam a hipótese."],
["Lesões bucais na infância","O herpes simples, após a primoinfecção, fica latente em qual local?",["Gânglio trigeminal","Glândula parótida","Medula óssea","Polpa dentária"],"Depois da primoinfecção, o HSV-1 permanece latente no gânglio trigeminal e pode reativar (herpes labial recorrente) com estresse, febre, sol ou baixa imunidade."],
["Manejo comportamental","Associe os estágios de Piaget à estratégia: I – Operatório concreto. II – Sensório-motor. III – Operatório formal. IV – Pré-operatório. Estratégias: 1 – Dizer-mostrar-fazer, histórias e reforço imediato. 2 – Autonomia, estética, privacidade. 3 – Explicações racionais e pequenas decisões. 4 – Explicações curtas, pais presentes, estímulos visuais e sonoros. Associação:",["I-3, II-4, III-2, IV-1","I-1, II-4, III-2, IV-3","I-2, II-4, III-3, IV-1","I-4, II-3, III-1, IV-2"],"Operatório concreto (7–11): raciocínio lógico e pequenas decisões. Sensório-motor (0–2): frases curtas e pais. Formal (12+): autonomia e privacidade. Pré-operatório (2–7): dizer-mostrar-fazer e histórias."],
["Manejo comportamental","Criança de 6 anos com choro sem lágrimas, que para quando a mãe sai da sala e retoma quando ela volta. Interpretação mais provável:",["Birra (choro de manha)","Dor intensa no dente","Medo real com pânico","Reação alérgica ao látex"],"Choro sem lágrimas, que varia conforme a plateia, sugere birra. Choro com lágrimas, rigidez e pavor sugerem medo ou dor. A diferença muda a técnica de manejo."],
["Manejo comportamental","Na avaliação da dor em criança, qual afirmação está correta?",["É subjetiva: usar escalas (0–10, faces), comportamento e relato dos pais","Só o relato dos pais tem valor, pois a criança sempre exagera a dor","Criança pequena não sente dor como adulto, então não precisa avaliar","Avalia-se só pelo choro: se não chora, não há nenhuma dor"],"A dor é subjetiva. Avalia-se o comportamento, o padrão, a localização e a intensidade com escalas adaptadas à idade, somando ao relato dos responsáveis."],
["Urgência e emergência","Sobre a avaliação do pulso em emergência pediátrica, assinale a correta:",["Carotídeo em crianças: um dos últimos a sumir e dos primeiros a voltar","Braquial em crianças de 6 anos, pois é o último pulso a desaparecer","Carotídeo, porque é um dos primeiros pulsos a desaparecer no choque","Radial, porque é sempre o mais confiável em qualquer faixa etária"],"Pulsos centrais (carotídeo, femoral) se mantêm mais tempo no choque. Em criança acima de 1 ano, usa-se o carotídeo; em bebês, o braquial."],

["Radiologia e diagnóstico","Paciente de 7 anos com 16 e 26 em erupção, opérculo e biofilme, ICDAS 1–2 na oclusal. Qual conduta preventiva é a mais indicada?",["Selante ionomérico, pela dificuldade de isolamento","Selante resinoso, mesmo com o campo úmido","Restauração em amálgama nas duas oclusais","Exodontia dos molares em erupção"],"Em molares em erupção, sem isolamento possível, o selante ionomérico é mais indicado. O resinoso precisa de campo seco. Lesões só em esmalte não pedem restauração."],

["Terapia pulpar","Necrose pulpar em decíduo com fístula e 2/3 de raiz, cripta do germe íntegra. Tratamento mais indicado:",["Pulpectomia","Pulpotomia","Capeamento pulpar direto","Apenas restauração"],"Com necrose, toda a polpa precisa ser removida: pulpectomia. A pulpotomia exige polpa radicular vital. Havendo 2/3 de raiz e cripta íntegra, é possível tratar e esperar reparo."],
["Cirurgia e anestesia","Para que serve a lista de alavancas Apical e Seldin infantis?",["Luxar dentes e raízes decíduas, com apoio em osso","Fazer a sutura do alvéolo após a exodontia","Condensar amálgama em cavidades de molares","Medir o comprimento do canal na pulpectomia"],"As alavancas luxam dentes e restos radiculares antes ou no lugar do fórceps. O apoio é em osso, nunca no dente vizinho, e o movimento é delicado para não lesar o germe."],
["Cirurgia e anestesia","Após anestesia no bloqueio do alveolar inferior em criança, qual orientação é importante aos pais?",["Vigiar para que não morda o lábio e a língua anestesiados","Dar comida dura logo em seguida para testar a anestesia","Deixar a criança brincar de morder o lábio, pois não dói","Nenhuma orientação é necessária após a anestesia"],"Com lábio e língua anestesiados por algumas horas, a criança pode morder e se ferir. Os pais devem vigiar e evitar alimentos até passar o efeito."],
["Trauma dentário","Intrusão de incisivo decíduo com o ápice deslocado para vestibular (longe do germe). Conduta habitual:",["Acompanhar e aguardar a reerupção espontânea","Exodontia imediata em todos os casos","Reposicionar com fórceps e fazer contenção rígida","Reimplantar"],"Se o ápice foi para vestibular, longe do germe, aguarda-se a reerupção (semanas a meses). Se foi em direção ao germe, considera-se a exodontia."]

["Cardiopatias","Caso: paciente usa AAS diariamente após colocar um stent e precisa extrair um dente. Qual a conduta?",

["Doenças pulmonares","Caso: Gabriel, 12 anos, asmático, usa budesonida inalatória (bombinha) todos os dias e aparecem placas brancas removíveis no palato. Qual a orientação preventiva?",

["Doenças pulmonares","Caso: paciente com asma moderada não controlada, que relata alergia a vinho e a embutidos, precisa de uma restauração com anestesia. Qual anestésico escolher?",

["Doenças pulmonares","Caso: Sr. Carlos, 65 anos, fumante há 40 anos, tem falta de ar, tosse com muco e chiado. Os danos aos pulmões são irreversíveis. Qual a doença?",

["Síndrome de Down","Caso: João, 15 anos, com Síndrome de Down, vai fazer uma restauração. Qual cuidado de posicionamento é fundamental?",

["Síndrome de Down","Caso: Júlia, 20 anos, Síndrome de Down, tem perda óssea periodontal avançada, apesar de pouca experiência de cárie. Qual a explicação?",
["Alterações imunológicas: menos quimiotaxia e fagocitose","Excesso de flúor na água de abastecimento","Uso diário de bombinha de corticoide inalatório","Escovação excessiva e com muita força"],
"Na SD a periodontite tende a começar cedo e progredir rápido, por menor quimiotaxia e atividade fagocitária dos neutrófilos."],

["Síndrome de Down","Qual achado bucal é frequente na Síndrome de Down?",

["Diabetes","Caso: paciente com diabetes tipo 2 vai fazer uma raspagem. Qual o planejamento ideal da consulta?",

["Diabetes","Caso: no meio do atendimento, uma paciente diabética que tomou insulina e não tomou café fica pálida, suada, trêmula e confusa. A glicemia capilar é 58 mg/dL. Qual o quadro?",

["Diabetes","Caso: paciente relata sede intensa, muita fome, urinar muito e perder peso sem explicação. Também tem periodontite e candidíase de repetição. O que sugere?",

["Bebês e gestantes","Caso: gestante de 8 semanas pede para extrair um dente com cárie extensa, sem dor nem infecção. Qual a orientação?",

["Bebês e gestantes","Caso: a mãe de um bebê de 7 meses relata coceira na gengiva, irritabilidade e muita saliva. Ela pergunta se pode passar uma pomada anestésica. O que responder?",
["As pomadas anestésicas são contraindicadas; use mordedor ou dedeira","Pode passar a pomada várias vezes ao dia, sem problema","Deve dar antibiótico por causa da erupção dos dentes","Esses sintomas não têm nenhuma relação com os dentes"],

  { id:"odp", nome:"Odontopediatria", tag:"Estágio · PED", provas: PROVAS_ODP,
    titulo:"Odonto<em>pediatria</em>",
    desc:"Cálculo de doses, lesões bucais na infância, manejo (Piaget), RCP, dentição decídua, flúor, terapia pulpar e trauma." },
  { id:"pne", nome:"Pacientes com Necessidades Especiais", tag:"Clínica Integrada · PNE", provas: PROVAS_PNE,
    titulo:"Pacientes com <em>Necessidades Especiais</em>",
    desc:"Casos de TEA, cardiopatias, doenças respiratórias, Síndrome de Down, diabetes, gestantes e bebês." }
];
MATERIAS.forEach(m=>{
  m.all = m.provas.flatMap((p,pi)=>p.questoes.map(q=>({q,m:m.id})));
  m.temas = [...new Set(m.all.map(x=>x.q[0]))];
});
const byId = id => MATERIAS.find(m=>m.id===id);

// ---------- armazenamento (opcional) ----------
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
function save(d){ try{ localStorage.setItem(STORE, JSON.stringify(d)); }catch(e){} }
let db = load(); db.best = db.best || {}; db.tries = db.tries || {}; db.mode = db.mode || "simulado"; if(db.shuffle===undefined) db.shuffle = true;
MATERIAS.forEach(m=>{ db.best[m.id] = db.best[m.id] || {}; db.tries[m.id] = db.tries[m.id] || {}; });

// ---------- util ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const fmtTime = s => { const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); };
const toothSVG = '<svg class="tooth" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.2 2.5c-2.6 0-4.4 2.1-4.4 5 0 2.2.9 3.6 1.6 5.4.6 1.6.7 3.5 1 5.4.3 2 .9 3.2 2 3.2 1.4 0 1.7-2 2-3.9.3-1.6.6-2.9 2.6-2.9s2.3 1.3 2.6 2.9c.3 1.9.6 3.9 2 3.9 1.1 0 1.7-1.2 2-3.2.3-1.9.4-3.8 1-5.4.7-1.8 1.6-3.2 1.6-5.4 0-2.9-1.8-5-4.4-5-1.7 0-2.8.8-4.8.8s-3.1-.8-4.8-.8z" opacity=".9"/></svg>';
const logo = `<button class="logo" data-home>${toothSVG}<span>estuda<b>emilly</b></span></button>`;
function setM(id){ if(id) app.setAttribute("data-m", id); else app.removeAttribute("data-m"); }
function setHash(h){ const cur=(location.hash||"").slice(1); if(cur===h) return; try{ history.pushState(null, "", h ? "#"+h : location.pathname+location.search); }catch(err){} }

// resumo de progresso de uma matéria
function resumo(m){
  const feitas = m.provas.filter((p,i)=>db.best[m.id][i]!=null).length;
  let soma=0, tot=0;
  m.provas.forEach((p,i)=>{ if(db.best[m.id][i]!=null){ soma+=db.best[m.id][i]; tot+=p.questoes.length; } });
  return { feitas, media: tot? Math.round(soma/tot*100) : null };
}

// ---------- estado ----------
let S = null; let tick = null; let MAT = null;

function startExam(mid, idx){
  let items, nome;
  if(mid === "geral"){
    const pool = MATERIAS.flatMap(m=>m.all);
    items = shuffle(pool).slice(0,30); nome = "Prova geral (3 matérias)";
  } else {
    const m = byId(mid);
    if(idx === "mix"){ items = shuffle(m.all).slice(0,25); nome = "Prova surpresa"; }
    else { items = m.provas[idx].questoes.map(q=>({q,m:mid})); if(db.shuffle) items = shuffle(items); nome = m.provas[idx].nome; }
  }
  const qs = items.map(({q,m})=>{
    const order = shuffle(q[2].map((_,i)=>i));
    return { m, tema:q[0], texto:q[1], alts:order.map(i=>q[2][i]), certa:order.indexOf(0), exp:q[3] };
  });
  S = { mid, idx, nome, mode: db.mode, qs, ans: Array(qs.length).fill(null), cur:0, t0:Date.now(), elapsed:0, done:false, confirm:false, filter:"erradas" };
  setM(mid==="geral" ? null : mid);
  clearInterval(tick);
  tick = setInterval(()=>{ if(!S||S.done) return; S.elapsed = Math.floor((Date.now()-S.t0)/1000); const el=document.getElementById("timer"); if(el) el.textContent = fmtTime(S.elapsed); }, 1000);
  renderExam(); window.scrollTo(0,0);
}

// ---------- tela inicial: escolher matéria ----------
function renderHome(){
  clearInterval(tick); S = null; MAT = null; setM(null);
  const cards = MATERIAS.map(m=>{
    const r = resumo(m);
    return `<button class="mat" data-c="${m.id}" data-open="${m.id}">
      <div class="top"><span class="tag">${esc(m.tag)}</span><span class="muted" style="font-size:13.5px">${m.provas.length} provas · ${m.all.length} questões</span></div>
      <h2>${esc(m.nome)}</h2>
      <p>${esc(m.desc)}</p>
      <div class="bar" aria-hidden="true"><i style="width:${r.feitas/m.provas.length*100}%"></i></div>
      <div class="meta"><span>Provas feitas: <b>${r.feitas}/${m.provas.length}</b></span><span>${r.media!=null? "Média das melhores: <b>"+r.media+"%</b>" : "Ainda não começou"}</span></div>
    </button>`;
  }).join("");
  const total = MATERIAS.reduce((n,m)=>n+m.all.length,0);
  app.innerHTML = `<div class="wrap fade">
    <header class="brand">${logo}</header>
    <section class="hero">
      <h1>Escolha a <em>matéria</em></h1>
      <p class="muted">Cada matéria tem 5 provas de 25 questões, feitas a partir do material de aula e das provas anteriores. Treine uma de cada vez ou misture tudo na prova geral.</p>
    </section>
    <div class="mats">${cards}
      <button class="mat geral" data-start-geral>
        <div class="top"><span class="tag">Revisão final</span><span class="muted" style="font-size:13.5px">30 questões</span></div>
        <h2>Prova geral</h2>
        <p>Sorteia questões das 3 matérias juntas.</p>
      </button>
    </div>
    <div class="foot">
      <span>${total} questões no total.</span>
      <span>Seu progresso fica salvo só neste navegador.</span>
      <span id="resetwrap"><button class="linkbtn" id="reset">Apagar meu histórico</button></span>
    </div>
  </div>`;
}

// ---------- tela da matéria ----------
function renderMateria(mid){
  clearInterval(tick); S = null; MAT = mid; setM(mid);
  const m = byId(mid);
  const cards = m.provas.map((p,i)=>{
    const best = db.best[mid][i]; const tries = db.tries[mid][i]||0;
    const pct = best!=null ? Math.round(best/p.questoes.length*100) : 0;
    return `<button class="card" data-start="${i}">
      <div class="top"><h3>${esc(p.nome)}</h3><span class="n">${p.questoes.length} questões</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>Melhor: <b>${best!=null? best+"/"+p.questoes.length : "—"}</b></span><span>${tries? tries+(tries>1?" tentativas":" tentativa") : "Não feita"}</span></div>
    </button>`;
  }).join("");
  app.innerHTML = `<div class="wrap fade">
    <header class="brand">${logo}<button class="back" data-home>← Trocar de matéria</button></header>
    <section class="hero">
      <span class="chip accent" style="justify-self:start">${esc(m.tag)}</span>
      <h1>${m.titulo}</h1>
      <p class="muted">${esc(m.desc)}</p>
      <div class="subjects">${m.temas.map((t,i)=>`<span class="chip${i===0?" accent":""}">${esc(t)}</span>`).join("")}</div>
    </section>
    <section class="mode" aria-label="Modo de estudo">
      <span class="label">Como você quer treinar?</span>
      <div class="seg" role="group">
        <button data-mode="simulado" aria-pressed="${db.mode==="simulado"}"><strong>Simulado</strong><span>Responde tudo, vê a nota e a correção no final</span></button>
        <button data-mode="treino" aria-pressed="${db.mode==="treino"}"><strong>Treino</strong><span>Vê se acertou e a explicação a cada questão</span></button>
      </div>
      <label class="opts"><input type="checkbox" id="shuf" ${db.shuffle?"checked":""}> Embaralhar a ordem das questões</label>
    </section>
    <div class="grid">${cards}
      <button class="card mix" data-start="mix">
        <div class="top"><h3>Prova surpresa</h3><span class="n">25 questões</span></div>
        <div class="meta"><span>Sorteia questões das 5 provas desta matéria</span></div>
      </button>
    </div>
    <div class="foot"><span>${m.all.length} questões nesta matéria.</span></div>
  </div>`;
}

// ---------- prova ----------
function renderExam(){
  const q = S.qs[S.cur]; const a = S.ans[S.cur];
  const answered = S.ans.filter(x=>x!==null).length;
  const reveal = S.mode==="treino" && a!==null;
  const altsHTML = q.alts.map((t,i)=>{
    let cls = "alt";
    if(reveal){ if(i===q.certa) cls+=" ok"; else if(i===a) cls+=" no"; }
    return `<li><button class="${cls}" data-alt="${i}" aria-pressed="${a===i}" ${reveal?"disabled":""}><span class="k">${LETTERS[i]}</span><span>${esc(t)}</span></button></li>`;
  }).join("");
  let exp = "";
  if(reveal){
    const ok = a===q.certa;
    exp = `<div class="explain ${ok?"good":"bad"}" role="status"><strong>${ok?"Acertou!":"Resposta certa: "+LETTERS[q.certa]}</strong>${esc(q.exp)}</div>`;
  }
  const dots = S.qs.map((qq,i)=>{
    let c="dot"; const ai=S.ans[i];
    if(S.mode==="treino" && ai!==null) c += ai===qq.certa?" ok":" no"; else if(ai!==null) c+=" done";
    if(i===S.cur) c+=" cur";
    return `<button class="${c}" data-go="${i}" aria-label="Questão ${i+1}">${i+1}</button>`;
  }).join("");
  const last = S.cur===S.qs.length-1;
  const missing = S.qs.length - answered;
  const confirm = S.confirm ? `<div class="confirm" role="alert">
      <span>${missing>0? `Ainda faltam <b>${missing}</b> ${missing>1?"questões":"questão"} sem resposta. Questões em branco contam como erro.` : "Quer finalizar e ver sua nota?"}</span>
      <div class="row"><button class="btn primary" data-finish-yes>Finalizar agora</button><button class="btn" data-finish-no>Continuar respondendo</button></div>
    </div>` : "";
  const matChip = S.mid==="geral" ? `<span class="chip">${esc(byId(q.m).nome)}</span>` : "";
  const ttl = S.mid==="geral" ? S.nome : byId(S.mid).nome+" · "+S.nome;
  const nk = q.alts.length;
  app.innerHTML = `
  <div class="examhead"><div class="in">
    <button class="logo" data-quit aria-label="Sair da prova">${toothSVG}</button>
    <span class="ttl">${esc(ttl)}</span>
    <div class="prog"><small><span>${answered}/${S.qs.length} respondidas</span><span>${S.mode==="treino"?"Treino":"Simulado"} · <span class="timer" id="timer">${fmtTime(S.elapsed)}</span></span></small>
      <div class="bar"><i style="width:${answered/S.qs.length*100}%"></i></div></div>
    <button class="btn" data-finish>Finalizar</button>
  </div></div>
  <main class="wrap fade" style="padding-top:4px">
    <div class="qmeta"><span class="qnum">Questão ${S.cur+1} de ${S.qs.length}</span>${matChip}<span class="chip">${esc(q.tema)}</span></div>
    <p class="qtext">${esc(q.texto)}</p>
    <ul class="alts">${altsHTML}</ul>
    ${exp}
    <div class="nav">
      <button class="btn" data-prev ${S.cur===0?"disabled":""}>← Anterior</button>
      ${last ? `<button class="btn primary" data-finish>Ver resultado</button>` : `<button class="btn primary" data-next>Próxima →</button>`}
    </div>
    ${confirm}
    <div class="dots" aria-label="Ir para questão">${dots}</div>
    <p class="muted" style="font-size:13.5px;margin-top:18px">Atalhos: teclas ${LETTERS[0]}–${LETTERS[nk-1]} ou 1–${nk} para marcar, setas ← → para navegar.</p>
  </main>`;
}

function finish(){
  S.done = true; clearInterval(tick);
  S.elapsed = Math.floor((Date.now()-S.t0)/1000);
  S.acertos = S.qs.reduce((n,q,i)=>n+(S.ans[i]===q.certa?1:0),0);
  if(S.mid!=="geral" && S.idx!=="mix"){
    const b = db.best[S.mid], t = db.tries[S.mid];
    t[S.idx] = (t[S.idx]||0)+1;
    if(b[S.idx]==null || S.acertos>b[S.idx]) b[S.idx] = S.acertos;
    save(db);
  }
  renderResult(); window.scrollTo(0,0);
}

function renderResult(){
  const n = S.qs.length, ac = S.acertos, pct = Math.round(ac/n*100);
  const nota = (ac/n*10).toFixed(1).replace(".",",");
  const C = 2*Math.PI*56; const off = C*(1-ac/n);
  const msg = pct>=90?"Excelente, está pronta!": pct>=70?"Muito bem! Revise os erros para fechar.": pct>=50?"Bom caminho. Vale revisar os temas com menos acertos.":"Continue treinando: revise as explicações abaixo e refaça.";
  const geral = S.mid==="geral";
  const key = q => geral ? byId(q.m).nome : q.tema;
  const byT = {};
  S.qs.forEach((q,i)=>{ const k=key(q); byT[k] = byT[k]||{t:0,a:0}; byT[k].t++; if(S.ans[i]===q.certa) byT[k].a++; });
  const topics = Object.entries(byT).sort((x,y)=>(x[1].a/x[1].t)-(y[1].a/y[1].t)).map(([t,v])=>{
    const p = Math.round(v.a/v.t*100); const c = p<50?"lo":p<75?"mid":"hi";
    return `<div class="trow"><span>${esc(t)}</span><span class="pct">${v.a}/${v.t}</span><div class="bar"><i class="${c}" style="width:${Math.max(p,3)}%"></i></div></div>`;
  }).join("");
  const erradas = S.qs.filter((q,i)=>S.ans[i]!==q.certa).length;
  const list = S.qs.map((q,i)=>({q,i,a:S.ans[i]})).filter(x=> S.filter==="todas" || x.a!==x.q.certa).map(({q,i,a})=>{
    const st = a===null?"skip": a===q.certa?"ok":"no";
    return `<article class="rev ${st}">
      <div class="qmeta" style="margin:0"><span class="qnum">${i+1}</span>${geral?`<span class="chip">${esc(byId(q.m).nome)}</span>`:""}<span class="chip">${esc(q.tema)}</span>${st==="skip"?'<span class="chip">Em branco</span>':""}</div>
      <div class="q">${esc(q.texto)}</div>
      <div class="a">${st==="no"?`<span class="y">Sua resposta: ${LETTERS[a]}) ${esc(q.alts[a])}</span>`:""}<span class="c">Correta: ${LETTERS[q.certa]}) ${esc(q.alts[q.certa])}</span></div>
      <div class="e">${esc(q.exp)}</div>
    </article>`;
  }).join("") || `<p class="muted">Nenhuma questão errada. Parabéns!</p>`;
  const sub = geral ? S.nome : byId(S.mid).nome+" · "+S.nome;
  app.innerHTML = `<div class="wrap fade">
    <header class="brand">${logo}<span class="muted">${esc(sub)}</span></header>
    <section class="score">
      <div class="ring" role="img" aria-label="${ac} de ${n} acertos">
        <svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle class="fg" cx="66" cy="66" r="56" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <div class="v"><div><b>${ac}</b><br><span>de ${n}</span></div></div>
      </div>
      <div style="min-width:0"><h2>Nota ${nota}</h2><p>${msg}</p>
        <div class="stats"><span><b>${pct}%</b> de acertos</span><span>Tempo <b>${fmtTime(S.elapsed)}</b></span><span><b>${erradas}</b> para revisar</span></div></div>
    </section>
    <section class="section"><h3>${geral?"Desempenho por matéria":"Desempenho por tema"}</h3><div class="topics">${topics}</div></section>
    <section class="section"><h3>Correção</h3>
      <div class="filter"><button class="btn" data-filter="erradas" aria-pressed="${S.filter==="erradas"}">Só erros (${erradas})</button><button class="btn" data-filter="todas" aria-pressed="${S.filter==="todas"}">Todas (${n})</button></div>
      ${list}
    </section>
    <div class="actions"><button class="btn primary" data-redo>Refazer esta prova</button>${geral?"":`<button class="btn" data-back-mat>Voltar para ${esc(byId(S.mid).nome)}</button>`}<button class="btn" data-home>Trocar de matéria</button></div>
  </div>`;
}

// ---------- navegação ----------
function goHome(push){ if(push) setHash(""); renderHome(); window.scrollTo(0,0); }
function goMat(mid, push){ if(push) setHash(mid); renderMateria(mid); window.scrollTo(0,0); }
function route(){ const h=(location.hash||"").slice(1); if(byId(h)) goMat(h,false); else goHome(false); }
window.addEventListener("popstate", route);

app.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.home!==undefined){ goHome(true); return; }
  if(d.open){ goMat(d.open, true); return; }
  if(d.startGeral!==undefined){ startExam("geral"); return; }
  if(d.quit!==undefined){ const mid=S&&S.mid; if(mid && mid!=="geral") goMat(mid,false); else goHome(false); return; }
  if(d.backMat!==undefined){ goMat(S.mid,false); return; }
  if(d.mode){ db.mode = d.mode; save(db); document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===db.mode)); return; }
  if(d.start!==undefined && MAT){ startExam(MAT, d.start==="mix"?"mix":Number(d.start)); return; }
  if(t.id==="reset"){ document.getElementById("resetwrap").innerHTML = 'Apagar notas e tentativas das 3 matérias? <button class="linkbtn" id="reset-yes">Sim, apagar</button> · <button class="linkbtn" id="reset-no">Cancelar</button>'; return; }
  if(t.id==="reset-yes"){ MATERIAS.forEach(m=>{ db.best[m.id]={}; db.tries[m.id]={}; }); save(db); renderHome(); return; }
  if(t.id==="reset-no"){ renderHome(); return; }
  if(!S) return;
  if(d.alt!==undefined){ choose(Number(d.alt)); return; }
  if(d.next!==undefined){ go(S.cur+1); return; }
  if(d.prev!==undefined){ go(S.cur-1); return; }
  if(d.go!==undefined){ go(Number(d.go)); return; }
  if(d.finish!==undefined){ S.confirm = true; renderExam(); const c=document.querySelector(".confirm"); if(c) c.scrollIntoView({block:"center",behavior:"smooth"}); return; }
  if(d.finishYes!==undefined){ finish(); return; }
  if(d.finishNo!==undefined){ S.confirm=false; renderExam(); return; }
  if(d.filter){ S.filter = d.filter; renderResult(); return; }
  if(d.redo!==undefined){ startExam(S.mid, S.idx); return; }
});
app.addEventListener("change", e=>{ if(e.target.id==="shuf"){ db.shuffle = e.target.checked; save(db); } });

function choose(i){
  if(S.done) return;
  if(S.mode==="treino" && S.ans[S.cur]!==null) return;
  S.ans[S.cur] = i; S.confirm=false; renderExam();
  if(S.mode==="treino"){ const ex=document.querySelector(".explain"); if(ex) ex.scrollIntoView({block:"nearest",behavior:"smooth"}); }
}
function go(i){ if(i<0||i>=S.qs.length) return; S.cur=i; S.confirm=false; renderExam(); window.scrollTo({top:0}); }

document.addEventListener("keydown", e=>{
  if(!S || S.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = S.qs[S.cur].alts.length;
  const k = e.key.toUpperCase();
  let i = LETTERS.indexOf(k); if(i<0 && /^[1-9]$/.test(k)) i = Number(k)-1;
  if(i>=0 && i<n){ choose(i); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ go(S.cur+1); }
  else if(e.key==="ArrowLeft"){ go(S.cur-1); }
});

route();
})();
</script>

</body>
</html>
