<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>estudaemilly PNE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simulados em casos clínicos de Pacientes com Necessidades Especiais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: coluna única de leitura (max 760px); barra fixa no topo durante a prova; grade de cartões na tela inicial. */
:root{
  --bg:#f3f6f7;        /* esmalte frio */
  --surface:#ffffff;
  --surface-2:#e8eef0;
  --ink:#16243a;       /* tinta de prontuário */
  --muted:#5b6b7d;
  --line:#d3dde2;
  --accent:#3f55b8;    /* azul clínico */
  --accent-soft:#e1e6fa;
  --good:#1f7a55; --good-soft:#dcf1e7;
  --bad:#b33a2e;  --bad-soft:#f8e0dc;
  --warn:#8a5a00;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e151d; --surface:#16202b; --surface-2:#1e2a37; --ink:#e7edf3; --muted:#9aabbd; --line:#2a3949;
  --accent:#93a6ff; --accent-soft:#1c2347; --good:#5fd3a0; --good-soft:#123326; --bad:#ff8a7c; --bad-soft:#3a1c18; --warn:#f0c060;
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0e151d; --surface:#16202b; --surface-2:#1e2a37; --ink:#e7edf3; --muted:#9aabbd; --line:#2a3949;
  --accent:#93a6ff; --accent-soft:#1c2347; --good:#5fd3a0; --good-soft:#123326; --bad:#ff8a7c; --bad-soft:#3a1c18; --warn:#f0c060;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700;font-size:15px;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}

/* topo */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.logo b{color:var(--accent)}
.tooth{width:22px;height:22px;flex:none}

/* início */
.hero{padding-block:28px 8px;display:grid;gap:12px}
.hero h1{font-size:clamp(34px,7vw,52px);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;max-width:58ch}
.subjects{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

.mode{margin-top:22px;display:grid;gap:8px}
.label{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface-2);border-radius:var(--r);padding:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:10px 12px;cursor:pointer;text-align:left;display:grid;gap:2px}
.seg button strong{font-size:15.5px}
.seg button span{font-size:13px;color:var(--muted);line-height:1.35}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"] strong{color:var(--accent)}
.opts{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:15px}
.opts input{width:18px;height:18px;accent-color:var(--accent)}

.grid{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:grid;gap:10px;align-content:start;min-width:0}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:22px;font-weight:700}
.card .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.card .meta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.card .meta b{color:var(--ink)}
.card.mix{background:var(--surface-2);border-style:dashed}
.foot{margin-top:28px;font-size:13.5px;color:var(--muted);display:grid;gap:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13.5px;justify-self:start}

/* prova */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
.examhead{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.examhead .in{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.examhead .ttl{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.examhead .prog{flex:1;min-width:0;display:grid;gap:4px}
.examhead .prog small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px}
.qnum{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(19px,3.2vw,22px);line-height:1.45;margin:10px 0 18px;font-weight:700}
.alts{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.alt{width:100%;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;line-height:1.45;font-size:16.5px}
.alt:hover:not(:disabled){border-color:var(--ink)}
.alt .k{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:14px;font-family:var(--f-display)}
.alt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.alt[aria-pressed="true"] .k{background:var(--accent);color:var(--surface)}
.alt.ok{border-color:var(--good);background:var(--good-soft)}
.alt.ok .k{background:var(--good);color:var(--surface)}
.alt.no{border-color:var(--bad);background:var(--bad-soft)}
.alt.no .k{background:var(--bad);color:var(--surface)}
.alt:disabled{cursor:default}
.explain{margin-top:14px;border-radius:var(--r);padding:14px 16px;background:var(--surface-2);font-size:15.5px}
.explain strong{display:block;margin-bottom:4px;font-family:var(--f-display);font-size:16px}
.explain.good strong{color:var(--good)} .explain.bad strong{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.dots{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.dot{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.dot.done{background:var(--surface-2);border-color:var(--surface-2)}
.dot.cur{border-color:var(--accent);color:var(--accent)}
.dot.ok{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}
.dot.no{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.confirm{margin-top:18px;border:1.5px solid var(--warn);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;background:var(--surface)}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap}

/* resultado */
.score{margin-top:26px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display)}
.ring .v b{font-size:34px;font-weight:800;line-height:1}
.ring .v span{font-size:12.5px;color:var(--muted);font-family:var(--f-body)}
.score h2{font-size:clamp(26px,5vw,34px);font-weight:800}
.score p{margin:6px 0 0}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.section{margin-top:30px;display:grid;gap:12px}
.section h3{font-size:20px}
.topics{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;font-size:15px}
.trow .bar{grid-column:1/-1;height:8px}
.trow .bar i.lo{background:var(--bad)} .trow .bar i.mid{background:var(--warn)} .trow .bar i.hi{background:var(--good)}
.trow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.filter{display:flex;gap:8px;flex-wrap:wrap}
.filter .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;gap:8px}
.rev.no{border-left:5px solid var(--bad)} .rev.ok{border-left:5px solid var(--good)} .rev.skip{border-left:5px solid var(--warn)}
.rev .q{font-weight:700}
.rev .a{font-size:15px;display:grid;gap:3px}
.rev .a .y{color:var(--bad)} .rev .a .c{color:var(--good)}
.rev .e{font-size:14.5px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
@media (max-width:520px){
  .score{grid-template-columns:1fr;justify-items:start}
  .seg{grid-template-columns:1fr}
  .examhead .ttl{display:none}
  body{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .25s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
  .ring circle.fg{transition:stroke-dashoffset .9s ease-out}
}
</style>

</head>
<body>
<div id="app"></div>

<script>
// Banco de questões — Clínica Integrada da Pessoa com Necessidades Especiais (PNE)
// 5 provas x 25 questões, em formato de casos clínicos.
// Formato: [tema, enunciado, [CORRETA, errada, errada, errada], explicação]
const PROVAS = [
{
nome: "Prova 1",
questoes: [
["TEA","Caso: Lucas, 6 anos, chega com a mãe. Não faz contato visual, repete frases que ouve (ecolalia), anda na ponta dos pés e fica balançando as mãos. A mãe diz que ele ainda não tem diagnóstico. Qual a conduta correta do cirurgião-dentista?",
["Não dar diagnóstico; se a família abrir espaço, sugerir avaliação com especialista","Informar à mãe que o filho tem TEA nível 2 e já iniciar o tratamento","Recusar o atendimento até que a família traga um laudo médico","Dizer à mãe que é só timidez e que isso passa com a idade"],
"O dentista não dá diagnóstico de TEA. Se o responsável der abertura, pode sugerir procurar um profissional especializado. O atendimento odontológico continua normalmente, com manejo adaptado."],
["TEA","Caso: Sofia, 8 anos, TEA nível 1, vai fazer a primeira consulta. A mãe conta que ela fica muito agitada com mudanças na rotina. O que orientar antes da consulta?",
["Usar figuras antecipatórias e explicar o trajeto desde a saída de casa","Não contar nada para ela, para evitar ansiedade antecipada","Marcar cada consulta em horário e sala diferentes","Trazer a criança sem avisar que é dentista"],
"Pessoas com TEA têm dificuldade com mudanças. Figuras antecipatórias e um cronograma com fotos do local ajudam a desmistificar o atendimento."],
["TEA","Caso: Pedro, 10 anos, TEA, tem hipersensibilidade sensorial e se desespera com o barulho do motor. Tem uma lesão de cárie oclusal em molar. Qual abordagem é a mais indicada?",
["ART, sem alta e baixa rotação, e dessensibilizar o barulho em casa","Sedação com óxido nitroso logo na primeira sessão","Restauração convencional com alta rotação e estabilização","Aguardar a lesão evoluir até ele aceitar o motor"],
"O material orienta evitar alta e baixa rotação e usar ART. Para dessensibilizar, os pais podem ligar um secador de cabelo para ele se acostumar com o ruído."],
["TEA","Qual instrumento de rastreio de risco de TEA é um checklist respondido pelos pais, em que de 8 a 20 pontos indicam alto risco?",
["M-CHAT","IRDI","BTAT","Escala de Glasgow"],
"M-CHAT (23 ou 27 questões): acima de 3 pontos há risco; de 3 a 7, risco moderado; de 8 a 20, alto risco. O IRDI também é um instrumento de risco, e o BTAT avalia o frênulo lingual."],
["Hipertensão","Caso: Sr. José, 58 anos, hipertenso em uso de hidroclorotiazida, vai fazer uma raspagem. A PA aferida na cadeira é 135/85 mmHg. Qual a conduta?",
["Atender, com consulta curta e manhã, e levantar a cadeira devagar","Adiar a raspagem e encaminhar ao médico com urgência","Suspender o diurético por conta própria 24 h antes","Usar lidocaína com epinefrina 1:50.000 sem limite"],
"Valores de 120–139/80–89 mmHg estão na faixa de atenção. O diurético aumenta o risco de hipotensão ortostática, por isso a cadeira deve ser levantada devagar."],
["Hipertensão","Caso: D. Maria, 62 anos, chega para uma exodontia eletiva. A PA aferida é 168/104 mmHg e ela está assintomática. Qual a conduta?",
["Adiar o eletivo e encaminhar ao médico","Fazer a exodontia com 4 tubetes de anestésico","Dar um ansiolítico e fazer a exodontia mesmo assim","Fazer a exodontia sem anestésico para não subir a PA"],
"Hipertensão estágio II (≥ 160/100): faixa vermelha, intervenção e adiamento do atendimento eletivo."],
["Hipertensão","Caso: paciente hipertenso bem controlado precisa de uma restauração com anestesia. Qual o protocolo anestésico do material?",
["Lidocaína 2% com epinefrina 1:100.000, até 2 tubetes","Lidocaína 2% com epinefrina 1:50.000, sem limite","Bupivacaína com epinefrina, 6 tubetes","Articaína com epinefrina 1:100.000, 5 tubetes"],
"Limite de 0,04 mg de epinefrina por sessão, cerca de 2 tubetes. A prilocaína 3% com felipressina é a alternativa quando há contraindicação ao vasoconstritor adrenérgico."],
["Cardiopatias","Caso: Sr. Antônio teve um infarto há 3 semanas e chega com uma restauração fraturada, sem dor. O que fazer?",
["Adiar o eletivo; IAM com menos de 1 mês é alto risco","Fazer a restauração normalmente, pois não dói","Fazer a restauração sem anestesia para evitar risco","Suspender o AAS e fazer a restauração"],
"IAM recente (< 1 mês): evitar tratamento eletivo; só urgências (dor, infecção, sangramento), em ambiente hospitalar. Após 6 meses o risco é menor."],
["Cardiopatias","Caso: durante uma consulta, o paciente refere dor retrosternal irradiando para o braço esquerdo, com sudorese. Está consciente. Ele toma nitroglicerina e a dor passa em 5 minutos. Qual o quadro mais provável?",
["Crise de angina pectoris","Infarto agudo do miocárdio","Crise de asma","Hipoglicemia"],
"Na angina a dor dura de 2 a 10 minutos e alivia com repouso ou nitroglicerina sublingual. No IAM a dor não cede com repouso nem nitroglicerina."],
["Cardiopatias","Caso: paciente usa AAS diariamente após colocar um stent e precisa extrair um dente. Qual a conduta?",
["Manter o AAS e controlar o sangramento com medidas locais","Suspender o AAS 7 dias antes da extração","Trocar o AAS por varfarina antes da cirurgia","Contraindicar qualquer extração enquanto usar AAS"],
"Não se suspende o AAS: o risco de trombose supera o de sangramento. Usa-se gaze, sutura, esponja de gelatina ou ácido tranexâmico local."],
["Endocardite","Caso: Ana, 25 anos, tem prótese valvar cardíaca e vai fazer raspagem subgengival. Não tem alergias. Qual a profilaxia?",
["Amoxicilina 2 g VO, dose única, 30 a 60 min antes","Amoxicilina 500 mg de 8/8 h por 7 dias depois","Azitromicina 500 mg por 3 dias após o procedimento","Não precisa de profilaxia para raspagem"],
"Prótese valvar é condição de alto risco e a raspagem manipula o tecido gengival. Dose pediátrica de amoxicilina: 50 mg/kg."],
["Endocardite","Para qual destes procedimentos NÃO é recomendada a profilaxia de endocardite, mesmo em paciente de alto risco?",
["Radiografia","Exodontia","Raspagem subgengival","Anestesia infiltrativa que perfura a mucosa"],
"A profilaxia é para manipulação gengival, periapical ou perfuração da mucosa. Exceções: radiografias, aparelhos removíveis, ajuste ortodôntico e esfoliação de decíduos."],
["Doenças pulmonares","Caso: Gabriel, 12 anos, asmático, usa budesonida inalatória (bombinha) todos os dias e aparecem placas brancas removíveis no palato. Qual a orientação preventiva?",
["Bochechar com água após cada uso da bombinha","Parar a bombinha por conta própria","Escovar só uma vez por semana","Usar a bombinha sempre de estômago vazio"],
"O corticoide inalatório pode causar candidíase oral. Bochechar remove o excesso de pó. Com espaçador e máscara, também se lava a região perioral."],
["Doenças pulmonares","Caso: paciente com asma moderada não controlada, que relata alergia a vinho e a embutidos, precisa de uma restauração com anestesia. Qual anestésico escolher?",
["Mepivacaína sem vaso ou prilocaína com felipressina","Lidocaína com epinefrina 1:50.000","Articaína com epinefrina 1:100.000","Qualquer anestésico que contenha adrenalina"],
"O bissulfito é o conservante dos anestésicos com adrenalina e também está em embutidos, cerveja e vinho. O asmático é 8 vezes mais alérgico ao bissulfito."],
["Doenças pulmonares","Caso: Sr. Carlos, 65 anos, fumante há 40 anos, tem falta de ar, tosse com muco e chiado. Os danos aos pulmões são irreversíveis. Qual a doença?",
["DPOC (bronquite crônica / enfisema)","Asma brônquica leve e controlada","Bronquiolite viral aguda do adulto","Pneumonia bacteriana comunitária"],
"A DPOC é inflamatória, crônica, sistêmica e progressiva. A bronquite crônica é típica de fumantes e o enfisema é irreversível, ligado ao cigarro e à deficiência de α-1 antitripsina."],
["Síndrome de Down","Caso: João, 15 anos, com Síndrome de Down, vai fazer uma restauração. Qual cuidado de posicionamento é fundamental?",
["Evitar hiperextensão e flexão forçada do pescoço","Manter a cabeça bem estendida para ver melhor","Atender com o paciente totalmente deitado e cabeça para trás","Não há cuidado especial de posicionamento"],
"A instabilidade atlanto-axial ocorre em 10 a 30% dos casos. Hiperextensão ou flexão forçada pode causar lesão medular grave."],
["Síndrome de Down","Caso: Júlia, 20 anos, Síndrome de Down, tem perda óssea periodontal avançada, apesar de pouca experiência de cárie. Qual a explicação?",
["Alterações imunológicas: menos quimiotaxia e fagocitose","Excesso de flúor na água de abastecimento","Uso diário de bombinha de corticoide inalatório","Escovação excessiva e com muita força"],
"Na SD a periodontite tende a começar cedo e progredir rápido, por menor quimiotaxia e atividade fagocitária dos neutrófilos."],
["Síndrome de Down","Qual a alteração cromossômica da Síndrome de Down?",
["Trissomia do 21: 47 cromossomos","Monossomia do X: 45 cromossomos","Trissomia do 18: 47 cromossomos","Deleção no cromossomo 5: 46 cromossomos"],
"Há um cromossomo a mais no par 21. Foi descrita por John Langdon Down em 1866."],
["Síndrome de Down","Qual achado bucal é frequente na Síndrome de Down?",
["Agenesia de incisivos laterais e erupção tardia","Erupção precoce de todos os permanentes","Macrodontia generalizada","Palato baixo e largo"],
"Também são comuns: microdontia, palato alto e estreito, tendência a Classe III, mordida aberta e cruzada, macroglossia relativa, língua fissurada e bruxismo."],
["Diabetes","Caso: paciente com diabetes tipo 2 vai fazer uma raspagem. Qual o planejamento ideal da consulta?",

<script>

const toothSVG = '<svg class="tooth" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.2 2.5c-2.6 0-4.4 2.1-4.4 5 0 2.2.9 3.6 1.6 5.4.6 1.6.7 3.5 1 5.4.3 2 .9 3.2 2 3.2 1.4 0 1.7-2 2-3.9.3-1.6.6-2.9 2.6-2.9s2.3 1.3 2.6 2.9c.3 1.9.6 3.9 2 3.9 1.1 0 1.7-1.2 2-3.2.3-1.9.4-3.8 1-5.4.7-1.8 1.6-3.2 1.6-5.4 0-2.9-1.8-5-4.4-5-1.7 0-2.8.8-4.8.8s-3.1-.8-4.8-.8z" opacity=".9"/></svg>';

    // 25 questões sorteadas do banco inteiro

    items = PROVAS[idx].questoes.slice();

    return { tema:q[0], texto:q[1], alts:order.map(i=>q[2][i]), certa:order.indexOf(0), exp:q[3] };
  });

  clearInterval(tick);

      </div>
      <label class="opts"><input type="checkbox" id="shuf" ${db.shuffle?"checked":""}> Embaralhar a ordem das questões</label>
    </section>
    <div class="grid">${cards}
      <button class="card mix" data-start="mix">
        <div class="top"><h3>Prova surpresa</h3><span class="n">25 questões</span></div>
        <div class="meta"><span>Sorteia questões de todas as provas</span></div>
      </button>
    </div>
    <div class="foot">
      <span>${ALL.length} questões no total · temas: ${TEMAS.map(esc).join(", ")}.</span>
      <span>Seu progresso fica salvo só neste navegador.</span>
      <span id="resetwrap"><button class="linkbtn" id="reset">Apagar meu histórico</button></span>
    </div>
  </div>`;
}

// ---------- prova ----------
function renderExam(){
  const q = S.qs[S.cur]; const a = S.ans[S.cur];
  const answered = S.ans.filter(x=>x!==null).length;
  const reveal = S.mode==="treino" && a!==null;
  const altsHTML = q.alts.map((t,i)=>{
    let cls = "alt";
    if(reveal){ if(i===q.certa) cls+=" ok"; else if(i===a) cls+=" no"; }
    return `<li><button class="${cls}" data-alt="${i}" aria-pressed="${a===i}" ${reveal?"disabled":""}><span class="k">${LETTERS[i]}</span><span>${esc(t)}</span></button></li>`;
  }).join("");
  let exp = "";
  if(reveal){
    const ok = a===q.certa;
    exp = `<div class="explain ${ok?"good":"bad"}" role="status"><strong>${ok?"Acertou!":"Resposta certa: "+LETTERS[q.certa]}</strong>${esc(q.exp)}</div>`;
  }
  const dots = S.qs.map((qq,i)=>{
    let c="dot"; const ai=S.ans[i];
    if(S.mode==="treino" && ai!==null) c += ai===qq.certa?" ok":" no"; else if(ai!==null) c+=" done";
    if(i===S.cur) c+=" cur";
    return `<button class="${c}" data-go="${i}" aria-label="Questão ${i+1}">${i+1}</button>`;
  }).join("");
  const last = S.cur===S.qs.length-1;
  const missing = S.qs.length - answered;
  const confirm = S.confirm ? `<div class="confirm" role="alert">
      <span>${missing>0? `Ainda faltam <b>${missing}</b> ${missing>1?"questões":"questão"} sem resposta. Questões em branco contam como erro.` : "Quer finalizar e ver sua nota?"}</span>
      <div class="row"><button class="btn primary" data-finish-yes>Finalizar agora</button><button class="btn" data-finish-no>Continuar respondendo</button></div>
    </div>` : "";
  app.innerHTML = `
  <div class="examhead"><div class="in">
    <button class="logo" data-quit aria-label="Sair para o início">${toothSVG}</button>
    <span class="ttl">${esc(S.nome)}</span>
    <div class="prog"><small><span>${answered}/${S.qs.length} respondidas</span><span>${S.mode==="treino"?"Treino":"Simulado"} · <span class="timer" id="timer">${fmtTime(S.elapsed)}</span></span></small>
      <div class="bar"><i style="width:${answered/S.qs.length*100}%"></i></div></div>
    <button class="btn" data-finish>Finalizar</button>
  </div></div>
  <main class="wrap fade" style="padding-top:4px">
    <div class="qmeta"><span class="qnum">Questão ${S.cur+1} de ${S.qs.length}</span><span class="chip">${esc(q.tema)}</span></div>
    <p class="qtext">${esc(q.texto)}</p>
    <ul class="alts">${altsHTML}</ul>
    ${exp}
    <div class="nav">
      <button class="btn" data-prev ${S.cur===0?"disabled":""}>← Anterior</button>
      ${last ? `<button class="btn primary" data-finish>Ver resultado</button>` : `<button class="btn primary" data-next>Próxima →</button>`}
    </div>
    ${confirm}
    <div class="dots" aria-label="Ir para questão">${dots}</div>
    <p class="muted" style="font-size:13.5px;margin-top:18px">Atalhos: teclas A–D ou 1–4 para marcar, setas ← → para navegar.</p>
  </main>`;
}

function finish(){
  S.done = true; clearInterval(tick);
  S.elapsed = Math.floor((Date.now()-S.t0)/1000);
  const acertos = S.qs.reduce((n,q,i)=>n+(S.ans[i]===q.certa?1:0),0);
  S.acertos = acertos;
  if(S.idx!=="mix"){
    db.tries[S.idx] = (db.tries[S.idx]||0)+1;
    if(db.best[S.idx]==null || acertos>db.best[S.idx]) db.best[S.idx] = acertos;
    save(db);
  }
  renderResult(); window.scrollTo(0,0);
}

function renderResult(){
  const n = S.qs.length, ac = S.acertos, pct = Math.round(ac/n*100);
  const nota = (ac/n*10).toFixed(1).replace(".",",");
  const C = 2*Math.PI*56; const off = C*(1-ac/n);
  const msg = pct>=90?"Excelente, está pronta!": pct>=70?"Muito bem! Revise os erros para fechar.": pct>=50?"Bom caminho. Vale revisar os temas com menos acertos.":"Continue treinando: revise as explicações abaixo e refaça.";
  const byT = {};
  S.qs.forEach((q,i)=>{ byT[q.tema] = byT[q.tema]||{t:0,a:0}; byT[q.tema].t++; if(S.ans[i]===q.certa) byT[q.tema].a++; });
  const topics = Object.entries(byT).sort((x,y)=>(x[1].a/x[1].t)-(y[1].a/y[1].t)).map(([t,v])=>{
    const p = Math.round(v.a/v.t*100); const c = p<50?"lo":p<75?"mid":"hi";
    return `<div class="trow"><span>${esc(t)}</span><span class="pct">${v.a}/${v.t}</span><div class="bar"><i class="${c}" style="width:${Math.max(p,3)}%"></i></div></div>`;
  }).join("");
  const erradas = S.qs.filter((q,i)=>S.ans[i]!==q.certa).length;
  const list = S.qs.map((q,i)=>({q,i,a:S.ans[i]})).filter(x=> S.filter==="todas" || x.a!==x.q.certa).map(({q,i,a})=>{
    const st = a===null?"skip": a===q.certa?"ok":"no";
    return `<article class="rev ${st}">
      <div class="qmeta" style="margin:0"><span class="qnum">${i+1}</span><span class="chip">${esc(q.tema)}</span>${st==="skip"?'<span class="chip">Em branco</span>':""}</div>
      <div class="q">${esc(q.texto)}</div>
      <div class="a">${st==="no"?`<span class="y">Sua resposta: ${LETTERS[a]}) ${esc(q.alts[a])}</span>`:""}<span class="c">Correta: ${LETTERS[q.certa]}) ${esc(q.alts[q.certa])}</span></div>
      <div class="e">${esc(q.exp)}</div>
    </article>`;
  }).join("") || `<p class="muted">Nenhuma questão errada. Parabéns!</p>`;
  app.innerHTML = `<div class="wrap fade">
    <header class="brand"><button class="logo" data-home>${toothSVG}<span>estuda<b>emilly</b></span></button><span class="muted">${esc(S.nome)}</span></header>
    <section class="score">
      <div class="ring" role="img" aria-label="${ac} de ${n} acertos">
        <svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle class="fg" cx="66" cy="66" r="56" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <div class="v"><div><b>${ac}</b><br><span>de ${n}</span></div></div>
      </div>
      <div style="min-width:0"><h2>Nota ${nota}</h2><p>${msg}</p>
        <div class="stats"><span><b>${pct}%</b> de acertos</span><span>Tempo <b>${fmtTime(S.elapsed)}</b></span><span><b>${erradas}</b> para revisar</span></div></div>
    </section>
    <section class="section"><h3>Desempenho por tema</h3><div class="topics">${topics}</div></section>
    <section class="section"><h3>Correção</h3>
      <div class="filter"><button class="btn" data-filter="erradas" aria-pressed="${S.filter==="erradas"}">Só erros (${erradas})</button><button class="btn" data-filter="todas" aria-pressed="${S.filter==="todas"}">Todas (${n})</button></div>
      ${list}
    </section>
    <div class="actions"><button class="btn primary" data-redo>Refazer esta prova</button><button class="btn" data-home>Voltar ao início</button></div>
  </div>`;
}

// ---------- eventos ----------
app.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.home!==undefined){ renderHome(); window.scrollTo(0,0); return; }
  if(d.quit!==undefined){ renderHome(); window.scrollTo(0,0); return; }
  if(d.mode){ db.mode = d.mode; save(db); document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===db.mode)); return; }
  if(d.start!==undefined){ startExam(d.start==="mix"?"mix":Number(d.start)); return; }
  if(t.id==="reset"){ document.getElementById("resetwrap").innerHTML = 'Apagar notas e tentativas? <button class="linkbtn" id="reset-yes">Sim, apagar</button> · <button class="linkbtn" id="reset-no">Cancelar</button>'; return; }
  if(t.id==="reset-yes"){ db.best={}; db.tries={}; save(db); renderHome(); return; }
  if(t.id==="reset-no"){ renderHome(); return; }
  if(!S) return;
  if(d.alt!==undefined){ choose(Number(d.alt)); return; }
  if(d.next!==undefined){ go(S.cur+1); return; }
  if(d.prev!==undefined){ go(S.cur-1); return; }
  if(d.go!==undefined){ go(Number(d.go)); return; }
  if(d.finish!==undefined){ S.confirm = true; renderExam(); const c=document.querySelector(".confirm"); if(c) c.scrollIntoView({block:"center",behavior:"smooth"}); return; }
  if(d.finishYes!==undefined){ finish(); return; }
  if(d.finishNo!==undefined){ S.confirm=false; renderExam(); return; }
  if(d.filter){ S.filter = d.filter; renderResult(); return; }
  if(d.redo!==undefined){ startExam(S.idx); return; }
});
app.addEventListener("change", e=>{ if(e.target.id==="shuf"){ db.shuffle = e.target.checked; save(db); } });

function choose(i){
  if(S.done) return;
  if(S.mode==="treino" && S.ans[S.cur]!==null) return;
  S.ans[S.cur] = i; S.confirm=false; renderExam();
  if(S.mode==="treino"){ const ex=document.querySelector(".explain"); if(ex) ex.scrollIntoView({block:"nearest",behavior:"smooth"}); }
}
function go(i){ if(i<0||i>=S.qs.length) return; S.cur=i; S.confirm=false; renderExam(); window.scrollTo({top:0}); }

document.addEventListener("keydown", e=>{
  if(!S || S.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  const map = {A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){ choose(map[k]); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ go(S.cur+1); }
  else if(e.key==="ArrowLeft"){ go(S.cur-1); }
});

renderHome();
})();
</script>

</body>
</html>
